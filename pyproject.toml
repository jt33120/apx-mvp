[project]
name = "apx"
version = "0.0.0"
description = "APX MVP — mass-document triage for law firms. Hexagonal core + adapters, one stateful service (PostgreSQL)."
requires-python = ">=3.13,<3.14"
# Runtime pins are the spine's Stack table (ARCHITECTURE-SPINE.md#Stack), verified
# 2026-07 in docs/context/05-stack-research-2026-07.md. Story 1.1 declares them;
# uv.lock is the discipline that makes them load-bearing (AD-3 builds one artefact).
# NOTE (environment deviation, if any): if a pinned version is not yet resolvable on
# the live index at build time, the developer records the substitution in the story's
# Completion Notes and keeps the spine version as the target — see Dev Notes.
dependencies = [
    "fastapi==0.139.2",
    "starlette==1.3.1",       # pinned, NOT inherited — FastAPI's constraint is unbounded across a major (review-versions H4)
    "uvicorn==0.51.0",
    "pydantic==2.13.4",
    "sqlalchemy==2.0.51",
    # psycopg[binary] bundles a working libpq wheel, so the package imports on any
    # dev machine without a system libpq (plain `psycopg` fails here — the box's
    # libpq is the wrong architecture). LGPL-3.0-only, in-process — to counsel
    # (AD-28). [binary] is discouraged for production; the binary-vs-c-vs-system
    # choice is the store/deploy story's (1.3), where it first actually connects.
    # DEVIATION from the story's plain `psycopg`, recorded here per the 1.1 review.
    "psycopg[binary]==3.3.4",
    "pgvector>=0.4,<0.5",     # Python helper (SQLAlchemy halfvec types); the EXTENSION pin 0.8.5 lives in docker-compose
    "alembic==1.18.5",
    "procrastinate>=3.9,<3.10",
    "pypdf==6.14.2",
]

[project.optional-dependencies]
# No runtime extras in 1.1. Auth, embedder, extraction, OCR, LLM deps belong to
# their own stories (see Dev Notes › What this story must NOT do).

[dependency-groups]
dev = [
    "import-linter>=2.0",  # the layering rule (AD-4); AD-33 names "import-graph rule", not the tool
    "pytest>=8.0",         # test runner (unnamed by the spine; the Python convention, and the salvaged v1 suite used it)
    "ruff>=0.6",           # lint (AD-33 "lint")
    "httpx2>=2.0",         # starlette TestClient transport, for the offline-boot fitness test
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship only the Python package. apx/web is a standalone npm project, excluded.
packages = ["apx"]
exclude = ["apx/web"]

# ─────────────────────────────────────────────────────────────────────────────
# The layering rule — the one structural property story 1.1 ships (AD-4).
# Enforced as a structural property (AD-33): a static import-graph check decides it.
# Run by `python -m apx.checks` (via apx/checks/layering.py) and in CI.
# The finer contracts (domain imports nothing outside itself; app imports only
# Domain+Ports; no adapter imports another adapter) are tightened in story 1.12 —
# left commented below so the intent is visible without 1.1 over-reaching.
# ─────────────────────────────────────────────────────────────────────────────
[tool.importlinter]
root_package = "apx"
# Required because the egress deny-list forbids EXTERNAL packages (boto3, supabase, …).
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core imports no adapter (AD-4)"
type = "forbidden"
source_modules = ["apx.core"]
forbidden_modules = ["apx.adapters"]

# ── Egress deny-list (AD-45, AD-3): "only code travels" / runs air-gapped. ──
# No apx runtime module may import a hosted-provider SDK. Enforced as a
# structural property; a dropped rule is a build failure (see apx/checks/import_contracts.py).
[[tool.importlinter.contracts]]
name = "apx imports no hosted SDK (AD-45)"
type = "forbidden"
source_modules = ["apx"]
forbidden_modules = ["supabase", "boto3", "botocore", "google", "vercel"]
allow_indirect_imports = true

# The OpenAI-compatible client is legitimate inside apx.adapters.llm_openai_compat
# (it talks to a LOCAL vLLM/Ollama endpoint, AD-27) but must never reach the core.
[[tool.importlinter.contracts]]
name = "core imports no hosted LLM SDK (AD-27)"
type = "forbidden"
source_modules = ["apx.core"]
forbidden_modules = ["openai"]
allow_indirect_imports = true

# [[tool.importlinter.contracts]]  # tightened in 1.12
# name = "domain imports nothing outside itself (AD-4)"
# type = "forbidden"
# source_modules = ["apx.core.domain"]
# forbidden_modules = ["apx.core.ports", "apx.core.app", "apx.adapters", "apx.api", "apx.worker"]

# [[tool.importlinter.contracts]]  # tightened in 1.12
# name = "no adapter imports another adapter (AD-4)"
# type = "independence"
# modules = ["apx.adapters.store_postgres", "apx.adapters.embedder_bgem3", "apx.adapters.llm_openai_compat", "apx.adapters.extraction", "apx.adapters.ocr_tesseract"]

[tool.ruff]
target-version = "py313"
line-length = 100
# Non-product trees `ruff check .` must not lint: vendored tooling (.claude,
# _bmad), planning output, generated Alembic scaffolding, the npm project, and
# reference material. Keeping these out makes `ruff check .` == the product code,
# so the natural command and a scoped `ruff check apx tests` agree (the 1.1 review
# found CI's `ruff check .` red on 217 violations inside .claude/).
extend-exclude = [
    "apx/web",
    "apx/adapters/store_postgres/migrations",
    ".claude",
    "_bmad",
    "_bmad-output",
    "docs",
    "design-artifacts",
    "Archives-legacy",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Layer-declaration docstrings are one intentional descriptive line naming the
# layer and its permitted dependency direction; length is not a defect here.
"apx/**/__init__.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ is unreachable from any runtime module under apx/ (AD-16); the enforcing
# check lands in 1.12. Fixtures live under tests/_fixtures and are never imported
# by runtime code.
norecursedirs = ["tests/_fixtures"]
