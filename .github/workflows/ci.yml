name: CI

# Story 1.1: green on the empty project. Two jobs — Python and web — that later
# stories extend. Story 1.2 adds the network-isolated offline-fitness job that
# drives this structure end to end (AD-2); it is NOT here yet.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Pin Python
        run: uv python install 3.13.14
      - name: Sync (runtime + dev)
        run: uv sync --group dev
      - name: Structural-property checks (AD-33) — incl. the layering rule (AD-4)
        run: uv run python -m apx.checks
      - name: Lint
        run: uv run ruff check .
      - name: Tests (incl. the layering failure-path regression, AC5)
        run: uv run pytest -q

  # The offline fitness frame (AD-2): the app boots and the checks hold with the
  # offline env set and no outbound network. The end-to-end coverage grows as the
  # pipeline is built (the driver marks unbuilt stages PENDING; it never fakes one).
  fitness:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      DO_NOT_TRACK: "1"
      SCARF_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Pin Python
        run: uv python install 3.13.14
      - name: Sync (runtime + dev)
        run: uv sync --group dev
      - name: Structural checks (layering AD-4 + egress deny-list AD-45/AD-27)
        run: uv run python -m apx.checks
      - name: End-to-end fitness driver (start + checks; the rest grows)
        run: uv run python -m apx.fitness
      - name: Offline-boot and driver tests (no outbound network)
        run: uv run pytest tests/fitness -q

  # The real database: run the migration up AND down (reversibility), then the
  # store's PostgreSQL integration tests (the DDL + CHECK constraint the SQLite
  # unit tests cannot cover). This is where the first migration meets a real DB.
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: apx
          POSTGRES_PASSWORD: apxci
          POSTGRES_DB: apx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apx -d apx"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://apx:apxci@localhost:5432/apx
      # The service Postgres is a same-host loopback with no TLS; opt out of the require default
      # (the documented same-machine exemption, AD-31) so alembic + the app connect. The store
      # integration tests get their encryption key from the pytest conftest fixture.
      APX_DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Pin Python
        run: uv python install 3.13.14
      - name: Sync (runtime + dev)
        run: uv sync --group dev
      - name: Migration up
        run: uv run alembic upgrade head
      - name: Migration down (reversibility)
        run: uv run alembic downgrade base
      - name: Migration up again
        run: uv run alembic upgrade head
      - name: Store integration tests (real PostgreSQL)
        run: uv run pytest tests/adapters -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apx/web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apx/web/.nvmrc
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Build the static SPA (AD-29)
        run: npm run build
