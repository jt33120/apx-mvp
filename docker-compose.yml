# APX on one machine (the on-prem form-factor): the app + one stateful service
# (PostgreSQL 18 + pgvector, the extension pinned here). `docker compose up` and open
# http://localhost:8000. Fully offline unless an LLM key is set.
services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: apx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apx}
      POSTGRES_DB: apx
    volumes:
      - apx-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apx -d apx"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://apx:${POSTGRES_PASSWORD:-apx}@db:5432/apx
      # Required — generate once and keep it (e.g. `openssl rand -hex 32`).
      APX_SECRET_KEY: ${APX_SECRET_KEY:?set APX_SECRET_KEY (e.g. openssl rand -hex 32)}
      # Encryption at rest (AD-31), layer 1: the application key — REQUIRED, no default. The
      # start-up gate refuses to boot without it. Generate once: `openssl rand -base64 32`.
      APX_ENCRYPTION_KEY: ${APX_ENCRYPTION_KEY:?set APX_ENCRYPTION_KEY (e.g. openssl rand -base64 32)}
      # Layer 2: attest the host data volume is encrypted. REQUIRED, no default — set it to 1
      # only AFTER backing the data volume with a real encrypted disk (dm-crypt/LUKS). A default
      # of 1 would be a permissive attestation (the gate would pass on a plaintext disk); the
      # attestation must be YOUR conscious act. The app cannot verify the block device itself.
      APX_VOLUME_ENCRYPTED: ${APX_VOLUME_ENCRYPTED:?set 1 only after encrypting the data volume (dm-crypt/LUKS)}
      # app↔db is a same-host link on the compose network (it never leaves the machine), so TLS
      # is not required here; a multi-host or hardened install should enable Postgres SSL and
      # set APX_DB_SSLMODE=require. Documented same-machine exemption (AD-31).
      APX_DB_SSLMODE: ${APX_DB_SSLMODE:-disable}
      # Optional LLM tier (EU-hosted Mistral, or point LLM_BASE_URL at an on-prem model).
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      JUDGE_WORKERS: ${JUDGE_WORKERS:-8}
      # The upload spool is a durable dir SHARED with the worker (Story 2.2): the API writes the
      # uploaded bytes here and the worker reads them after the request returns. APX_DATA_PATH names it.
      APX_DATA_PATH: /apx-spool
    ports:
      - "8000:8000"
    volumes:
      - apx-spool:/apx-spool
    depends_on:
      db:
        condition: service_healthy

  # The resumable import worker (Story 2.2, AD-6): it consumes the Procrastinate queue and commits
  # one pièce per unit against the application-owned ledger. It applies Procrastinate's queue schema
  # on start (kept out of the Alembic chain — AD-17) and shares the DB + the upload spool with the app.
  worker:
    build: .
    command: ["python", "-m", "apx.manage", "worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://apx:${POSTGRES_PASSWORD:-apx}@db:5432/apx
      APX_SECRET_KEY: ${APX_SECRET_KEY:?set APX_SECRET_KEY}
      APX_ENCRYPTION_KEY: ${APX_ENCRYPTION_KEY:?set APX_ENCRYPTION_KEY}
      APX_VOLUME_ENCRYPTED: ${APX_VOLUME_ENCRYPTED:?set 1 only after encrypting the data volume}
      APX_DB_SSLMODE: ${APX_DB_SSLMODE:-disable}
      APX_DATA_PATH: /apx-spool
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - apx-spool:/apx-spool
    depends_on:
      db:
        condition: service_healthy

volumes:
  apx-data:
  apx-spool:
