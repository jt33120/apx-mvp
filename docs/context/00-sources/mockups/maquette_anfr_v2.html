      const useCountUp = (target, duration = 1100) => {
        const [val, setVal] = useState(0);
        useEffect(() => {
          let raf, start;
          const step = ts => {
            if (!start) start = ts;
            const p = Math.min(1, (ts - start) / duration);
            const eased = 1 - Math.pow(1 - p, 3);
            setVal(target * eased);
            if (p < 1) raf = requestAnimationFrame(step);
          };
          raf = requestAnimationFrame(step);
          return () => cancelAnimationFrame(raf);
        }, [target]);
        return val;
      };

          const id = setInterval(() => {
            i += 1;
            if (i > text.length) { clearInterval(id); return; }
            setOut(text.slice(0, i));

        const step = w / (data.length - 1);
        const d = data.map((v, i) => `${i === 0 ? 'M' : 'L'} ${i * step} ${norm(v)}`).join(' ');
        const area = `${d} L ${w} ${h} L 0 ${h} Z`;
        return (
          <svg viewBox={`0 0 ${w} ${h}`} width={w} height={h}>
            <defs>
              <linearGradient id={`sg-${color}`} x1="0" x2="0" y1="0" y2="1">

            {data.map((d, i) => {
              const len = (d.value / total) * C;
              const dash = `${len} ${C}`;

              return (

      const ImportPage = () => {
        const [files, setFiles] = useState([]);

        const inputRef = useRef(null);
        const stages = ['Upload', 'Parsing', 'OCR', 'Chunking', 'Embeddings', 'Classification', 'Indexé'];

        const addMock = () => {
          const mocks = [
            { name: 'SPA_NewLuxCo_2026.docx', size: 482, type: 'file' },
            { name: 'CSSF_Circular_25-901.pdf', size: 1240, type: 'pdf' },
            { name: 'Email_KYC_Trust.msg', size: 88, type: 'email' },
            { name: 'Slide_AIFMD_II.pptx', size: 2210, type: 'slides' }
          ];
          const items = mocks.map((m, i) => ({ ...m, id: Date.now() + i, stage: 0, conf: null, theme: null }));
          setFiles(items);
          // animate stages
          items.forEach((it, idx) => {
            stages.forEach((_, sIdx) => {
              setTimeout(() => {
                setFiles(fs => fs.map(f => {
                  if (f.id !== it.id) return f;
                  const isLast = sIdx === stages.length - 1;
                  return {
                    ...f,
                    stage: sIdx,
                    conf: isLast ? 0.78 + Math.random() * 0.2 : null,
                    theme: isLast ? (it.name.includes('CSSF') || it.name.includes('AIFMD') ? 'regulatory' : it.name.includes('SPA') || it.name.includes('Term') ? 'knowhow' : it.name.includes('KYC') ? 'a_revoir' : 'style') : null
                  };
                }));
              }, 220 * sIdx + 180 * idx);
            });
          });
        };

        const onDrop = e => {
          e.preventDefault(); setDrag(false);
          if (e.dataTransfer.files.length) addMock();
          else addMock();
        };

        return (
          <div className="space-y-5 p-8 anim-in">
            <div
              onDragOver={e => { e.preventDefault(); setDrag(true); }}
              onDragLeave={() => setDrag(false)}
              onDrop={onDrop}
              className={`rounded-2xl border-2 border-dashed border-forest-200 bg-cream-100 p-10 text-center transition ${drag ? 'drop-active' : ''}`}>

              <div className="mt-5 flex items-center justify-center gap-3">
                <Btn variant="primary" icon={I.plus} onClick={addMock} size="lg">{t('import.simulate')}</Btn>
                <Btn variant="ghost" icon={I.upload} onClick={() => inputRef.current?.click()}>{t('import.choose')}</Btn>
                <input ref={inputRef} type="file" multiple className="hidden" onChange={addMock}/>
              </div>
              <div className="mt-3 flex items-center justify-center gap-4 text-[11px] text-slate-500">
                <span>PDF · DOCX · XLSX · PPTX</span>
                <span>·</span>
                <span>MSG · EML</span>
                <span>·</span>
                <span>JPG · PNG (OCR)</span>
                <span>·</span>
                <span>ZIP (auto-extract)</span>
              </div>
            </div>

            {files.length > 0 && (
              <div className="rounded-2xl border border-cream-400 bg-white shadow-soft">
                <div className="flex items-center justify-between border-b border-cream-400 px-6 py-3">
                  <div className="text-sm font-medium text-forest-800">{t('import.pipeline')}</div>
                  <Pill tone="forest">{t('import.7steps')}</Pill>
                </div>
                <div className="divide-y divide-cream-300">
                  {files.map(f => {
                    const pct = ((f.stage + 1) / stages.length) * 100;
                    return (
                      <div key={f.id} className="px-6 py-4">
                        <div className="flex items-center justify-between">
                          <div className="flex min-w-0 items-center gap-3">
                            <TypeIcon type={f.type} className="h-5 w-5 text-forest-600 flex-shrink-0"/>
                            <div className="min-w-0">
                              <div className="truncate font-medium text-forest-800">{f.name}</div>
                              <div className="font-mono text-[11px] text-slate-500">{f.size} ko</div>
                            </div>
                          </div>
                          <div className="flex items-center gap-2">
                            {f.theme && <span className={`rounded-md border px-2 py-0.5 text-xs ${getTheme(f.theme).color}`}>{getTheme(f.theme).label}</span>}
                            {f.conf != null && <ConfidenceBar value={f.conf}/>}
                          </div>
                        </div>
                        <div className="mt-3 grid grid-cols-7 gap-1.5">
                          {stages.map((s, i) => {
                            const done = i < f.stage;
                            const cur = i === f.stage;
                            return (
                              <div key={s} className="flex flex-col items-center text-center">
                                <div className={`grid h-5 w-5 place-items-center rounded-full text-[9px] font-bold ${done ? 'bg-forest-600 text-cream-50' : cur ? 'bg-rose-300 text-forest-800 ring-4 ring-rose-100' : 'bg-cream-300 text-slate-400'}`}>
                                  {done ? <I.check className="h-3 w-3"/> : i + 1}
                                </div>
                                <div className={`mt-1 text-[9px] uppercase tracking-wider ${done || cur ? 'text-forest-700' : 'text-slate-400'}`}>{s}</div>
                              </div>
                            );
                          })}
                        </div>
                        <div className="mt-2 h-1 overflow-hidden rounded-full bg-cream-300">
                          <div className="h-full bg-forest-600 transition-all duration-500" style={{ width: `${pct}%` }}/>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* corpus existant */}
            <CorpusList/>
          </div>
        );
      };

      const CorpusList = () => {
        const t = useT();
        const [filter, setFilter] = useState('all');
        const filtered = filter === 'all' ? PROJECT.pieces : PROJECT.pieces.filter(p => p.status === filter);
        const counts = ['all','pertinent','a_revoir','rebut'].map(k => ({ k, n: k==='all' ? PROJECT.pieces.length : PROJECT.pieces.filter(p => p.status === k).length }));
        return (
          <div className="space-y-3">
            <div className="grid grid-cols-4 gap-3 text-sm">
              {counts.map(f => (
                <button key={f.k} onClick={() => setFilter(f.k)}
                  className={`rounded-xl border px-4 py-3 text-left transition ${filter === f.k ? 'border-forest-600 bg-white shadow-soft' : 'border-cream-400 bg-white/60 hover:bg-white'}`}>
                  <div className="text-[10px] uppercase tracking-[.18em] text-slate-500">{ {all:t('import.filter_all'), pertinent:t('import.filter_pertinent'), a_revoir:t('import.filter_revoir'), rebut:t('import.filter_rebut')}[f.k] }</div>
                  <div className="font-serif text-2xl font-semibold tabular-nums text-forest-800">{f.n}</div>
                </button>
              ))}
            </div>
            <div className="rounded-2xl border border-cream-400 bg-white shadow-soft">
              <div className="flex items-center justify-between border-b border-cream-400 px-6 py-3">
                <div className="text-sm font-medium text-forest-800">{t('import.corpus_title')}</div>
                <div className="text-xs text-slate-500">{filtered.length} {t('import.pieces_shown')}</div>
              </div>
              <div className="max-h-[420px] divide-y divide-cream-300 overflow-y-auto scroll-area">
                {filtered.map(p => (
                  <div key={p.id} className="grid grid-cols-12 items-center gap-3 px-6 py-3 text-sm">
                    <div className="col-span-1 font-mono text-[11px] tabular-nums text-slate-500">{p.cote}</div>
                    <div className="col-span-4 flex min-w-0 items-center gap-2"><TypeIcon type={p.type} className="h-4 w-4 flex-shrink-0 text-slate-500"/><span className="truncate font-medium text-forest-800">{p.nom}</span></div>
                    <div className="col-span-2 font-mono tabular-nums text-[11px] text-slate-500">{fmtDate(p.date)}</div>
                    <div className="col-span-2"><span className={`rounded-md border px-2 py-0.5 text-xs ${getTheme(p.thematique).color}`}>{getTheme(p.thematique).label}</span></div>
                    <div className="col-span-1"><StatusPill status={p.status}/></div>
                    <div className="col-span-2 flex items-center justify-end gap-2"><ConfidenceBar value={p.confidence}/></div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      };

      // =============================================================
      // TABLE — bibliothèque éditable
      // =============================================================
      const EditableCell = ({ value, onSave, multiline }) => {
        const [editing, setEditing] = useState(false);
        const [draft, setDraft] = useState(value);
        const [flash, setFlash] = useState(false);
        const ref = useRef(null);

        useEffect(() => setDraft(value), [value]);
        useEffect(() => { if (editing && ref.current) { ref.current.focus(); ref.current.select?.(); } }, [editing]);

        const commit = () => {
          if (draft !== value) { onSave(draft); setFlash(true); setTimeout(() => setFlash(false), 800); }
          setEditing(false);
        };

        if (editing) {
          if (multiline) return <textarea ref={ref} className="cell-edit w-full resize-none bg-transparent text-sm text-forest-800" rows="2" value={draft} onChange={e => setDraft(e.target.value)} onBlur={commit} onKeyDown={e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) commit(); if (e.key === 'Escape') { setDraft(value); setEditing(false); } }}/>;
          return <input ref={ref} className="cell-edit w-full bg-transparent text-sm text-forest-800" value={draft} onChange={e => setDraft(e.target.value)} onBlur={commit} onKeyDown={e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') { setDraft(value); setEditing(false); } }}/>;
        }
        return <div onClick={() => setEditing(true)} className={`-mx-1 cursor-text rounded px-1 transition hover:bg-rose-50/50 ${flash ? 'ring-2 ring-forest-300 ring-offset-1' : ''}`} title="Cliquez pour éditer">{value || <span className="text-slate-300">—</span>}</div>;
      };

      const TablePage = ({ openPiece }) => {
        const t = useT();
        const [rows, setRows] = useState(() => PROJECT.pieces.filter(p => p.status !== 'rebut').map(p => ({ ...p, contenuShort: p.summary })));
        const [history, setHistory] = useState([]);
        const [thFilter, setThFilter] = useState('all');
        const [search, setSearch] = useState('');

        const filtered = useMemo(() => rows.filter(r => (thFilter === 'all' || r.thematique === thFilter) && (!search || r.nom.toLowerCase().includes(search.toLowerCase()) || r.contenuShort.toLowerCase().includes(search.toLowerCase()))), [rows, thFilter, search]);

        const updateRow = (id, key, value) => {
          setRows(rs => rs.map(r => {
            if (r.id !== id) return r;
            setHistory(h => [{ ts: new Date().toLocaleTimeString('fr-FR'), rowId: id, cote: r.cote, key, prev: r[key], next: value }, ...h].slice(0, 8));
            return { ...r, [key]: value };
          }));
        };

        return (
          <div className="space-y-4 p-8 anim-in">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div>
                <div className="font-serif text-lg font-semibold text-forest-800">{t('table.title')}</div>
                <div className="text-xs text-slate-500">{t('table.sub')}</div>
              </div>
              <div className="flex items-center gap-2">
                <input type="search" placeholder={t('table.search')} value={search} onChange={e => setSearch(e.target.value)} className="w-64 rounded-lg border border-cream-400 bg-white px-3 py-1.5 text-sm placeholder:text-slate-400 focus:border-forest-300 focus:outline-none focus:ring-2 focus:ring-forest-100"/>
                <Btn variant="ghost" icon={I.download}>Excel</Btn>
                <Btn variant="ghost" icon={I.download}>Word</Btn>
                <Btn variant="primary" icon={I.scale}>{t('table.to_syllogism')}</Btn>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <button onClick={() => setThFilter('all')} className={`rounded-full border px-3 py-1 text-xs font-medium transition ${thFilter === 'all' ? 'border-forest-600 bg-forest-600 text-cream-50' : 'border-cream-400 bg-white text-forest-800 hover:bg-cream-100'}`}>{t('table.all_themes')}</button>
              {PROJECT.thematiques.filter(t => t.id !== 'rebut').map(t => (
                <button key={t.id} onClick={() => setThFilter(t.id)} className={`rounded-full border px-3 py-1 text-xs font-medium transition ${thFilter === t.id ? `${t.color} border-current` : 'border-cream-400 bg-white text-forest-800 hover:bg-cream-100'}`}>
                  {t.label}<span className="ml-1.5 tabular-nums opacity-60">{rows.filter(r => r.thematique === t.id).length}</span>
                </button>
              ))}
            </div>

            <div className="overflow-hidden rounded-2xl border border-cream-400 bg-white shadow-soft">
              <div className="overflow-x-auto scroll-area">
                <table className="w-full text-sm">
                  <thead className="bg-cream-100 text-[10px] uppercase tracking-[.16em] text-slate-600">
                    <tr>
                      <th className="w-16 px-4 py-3 text-left font-medium">Cote</th>
                      <th className="w-28 px-4 py-3 text-left font-medium">Date</th>
                      <th className="px-4 py-3 text-left font-medium">Pièce</th>
                      <th className="w-44 px-4 py-3 text-left font-medium">Intervenants</th>
                      <th className="px-4 py-3 text-left font-medium">Sommaire</th>
                      <th className="w-44 px-4 py-3 text-left font-medium">Thématique</th>
                      <th className="w-28 px-4 py-3 text-left font-medium">Confiance</th>
                      <th className="w-20 px-4 py-3 text-right font-medium">Audit</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-cream-300">
                    {filtered.map(r => {
                      const theme = getTheme(r.thematique);
                      return (
                        <tr key={r.id} className="hover:bg-cream-100/60">
                          <td className="px-4 py-3 align-top font-mono text-[11px] text-slate-600"><EditableCell value={r.cote} onSave={v => updateRow(r.id, 'cote', v)}/></td>
                          <td className="px-4 py-3 align-top font-mono tabular-nums text-[11px] text-slate-600">{fmtDate(r.date)}</td>
                          <td className="px-4 py-3 align-top">
                            <div className="flex items-center gap-2">
                              <TypeIcon type={r.type} className="h-4 w-4 flex-shrink-0 text-slate-400"/>
                              <span className="font-medium text-forest-800">{r.nom}</span>
                            </div>
                          </td>
                          <td className="px-4 py-3 align-top">
                            <div className="flex flex-wrap gap-1">{r.intervenants.slice(0,3).map(i => <span key={i} className="rounded bg-cream-200 px-1.5 py-0.5 text-xs text-forest-700">{i}</span>)}</div>
                          </td>
                          <td className="max-w-md px-4 py-3 align-top"><EditableCell value={r.contenuShort} onSave={v => updateRow(r.id, 'contenuShort', v)} multiline/></td>
                          <td className="px-4 py-3 align-top">
                            <select value={r.thematique} onChange={e => updateRow(r.id, 'thematique', e.target.value)} className={`rounded-md border px-2 py-1 text-xs font-medium ${theme.color} focus:outline-none`}>
                              {PROJECT.thematiques.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
                            </select>
                          </td>
                          <td className="px-4 py-3 align-top"><ConfidenceBar value={r.confidence}/></td>
                          <td className="px-4 py-3 align-top text-right">
                            <button onClick={() => openPiece(r)} className="inline-flex items-center gap-1 rounded-md border border-cream-400 px-2 py-1 text-xs text-forest-700 hover:bg-cream-100">
                              <I.eye className="h-3.5 w-3.5"/>Voir
                            </button>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              <div className="border-t border-cream-400 bg-cream-100/60 px-4 py-2 text-xs text-slate-600">
                {filtered.length} lignes affichées · edits persistés en mémoire de session · audit trail conservé
              </div>
            </div>

            {history.length > 0 && (
              <div className="rounded-2xl border border-cream-400 bg-white p-4 shadow-soft">
                <div className="mb-2 flex items-center gap-2">
                  <I.history className="h-4 w-4 text-slate-500"/>
                  <div className="text-sm font-medium text-forest-800">Historique des modifications (session)</div>
                </div>
                <ul className="space-y-1 text-xs text-slate-600">
                  {history.map((h, i) => (
                    <li key={i} className="flex items-baseline gap-2 font-mono">
                      <span className="tabular-nums text-slate-400">{h.ts}</span>
                      <span className="font-medium text-forest-800">{h.cote} · {h.key}</span>
                      <span className="text-slate-400">{(h.prev || '—').toString().slice(0, 36)}</span>
                      <span className="text-slate-400">→</span>
                      <span className="text-forest-700">{(h.next || '—').toString().slice(0, 56)}</span>
                    </li>
                  ))}
                </ul>
              </div>
            )}
          </div>
        );
      };

      // =============================================================
      // CHAT — streaming responses
      // =============================================================
      const formatChatBody = text => text.split('\n').map((line, i) => {
        const parts = []; let lastIdx = 0;
        const re = /\[(\d+)\]|\*\*(.+?)\*\*|\*(.+?)\*/g; let m;
        while ((m = re.exec(line)) !== null) {
          if (m.index > lastIdx) parts.push(line.slice(lastIdx, m.index));
          if (m[1] !== undefined) parts.push({ cite: parseInt(m[1], 10) });
          else if (m[2] !== undefined) parts.push({ bold: m[2] });
          else parts.push({ italic: m[3] });
          lastIdx = re.lastIndex;
        }
        if (lastIdx < line.length) parts.push(line.slice(lastIdx));
        return { key: i, parts };
      });

      const ChatPage = ({ openPiece }) => {
        const t = useT();
        const [history, setHistory] = useState(PROJECT.chatHistory);
        const [draft, setDraft] = useState('');
        const [activePiece, setActivePiece] = useState(null);
        const [streaming, setStreaming] = useState(false);
        const [streamText, setStreamText] = useState('');
        const [streamCitations, setStreamCitations] = useState([]);
        const scrollRef = useRef(null);

        const responses = {
          default: { text: 'D’après la **base mockée CL**, l’élément le plus utile est *l’email style guide* [1] qui fixe la préférence pour "we note" plutôt que "we believe", complété par le **brouillon d’alert AIFM** [2] qui structure la séparation obligations / monitoring.', citations: ['PP-004','PP-006'] },
          ubo: { text: 'Le mémo UBO interne [1] identifie un caveat récurrent : *les seuils de propriété effective sont systématiquement mal compris côté client*. Le SPA annoté [2] illustre une formulation prudente sur les déclarations de bénéficiaires.', citations: ['PP-005','PP-001'] }
        };

        useEffect(() => {
          if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
        }, [history, streamText]);

        const send = () => {
          if (!draft || streaming) return;
          const userMsg = { role: 'user', content: draft };
          setHistory(h => [...h, userMsg]);
          const txt = draft;
          setDraft('');
          setStreaming(true);
          const resp = txt.toLowerCase().includes('ubo') ? responses.ubo : responses.default;
          setStreamCitations(resp.citations);
          let i = 0;
          const id = setInterval(() => {
            i += 2;
            if (i > resp.text.length) {
              clearInterval(id);
              setHistory(h => [...h, { role: 'assistant', content: resp.text, citations: resp.citations }]);
              setStreamText(''); setStreamCitations([]); setStreaming(false);
              return;
            }
            setStreamText(resp.text.slice(0, i));
          }, 18);
        };

        return (
          <div className="grid h-[calc(100vh-78px)] grid-cols-3 gap-0 anim-in">
            <div className="col-span-2 flex flex-col border-r border-cream-400 bg-cream-50">
              <div ref={scrollRef} className="flex-1 overflow-y-auto px-8 py-6 scroll-area">
                <div className="mx-auto max-w-3xl space-y-6">
                  <div className="rounded-xl border border-rose-200 bg-rose-50/50 px-4 py-3 text-sm text-forest-800">
                    <div className="flex items-center gap-2 font-medium">
                      <I.shield className="h-4 w-4 text-rose-500"/>
  {t('chat.banner_title')}
                    </div>
                    <div className="mt-1 text-xs text-slate-600">{t('chat.banner_sub')}</div>
                  </div>

                  {history.map((m, idx) => (
                    <div key={idx} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div className={`max-w-[85%] rounded-2xl px-5 py-3 ${m.role === 'user' ? 'bg-forest-700 text-cream-50 shadow-soft' : 'border border-cream-400 bg-white text-forest-800 shadow-soft'}`}>
                        <div className="whitespace-pre-wrap text-sm leading-relaxed">
                          {formatChatBody(m.content).map(row => (
                            <div key={row.key}>
                              {row.parts.map((p, i) => {
                                if (typeof p === 'string') return <span key={i}>{p}</span>;
                                if (p.bold) return <strong key={i} className="font-semibold">{p.bold}</strong>;
                                if (p.italic) return <em key={i} className="italic">{p.italic}</em>;
                                if (p.cite !== undefined) {
                                  const cid = m.citations?.[p.cite - 1];
                                  const piece = cid ? getPiece(cid) : null;
                                  return <button key={i} onClick={() => piece && setActivePiece(piece)} className={`mx-0.5 inline-flex items-baseline rounded px-1 py-0 text-xs font-semibold ${m.role === 'user' ? 'bg-white/20' : 'bg-rose-100 text-rose-500 hover:bg-rose-200'}`}>[{p.cite}]</button>;
                                }
                                return null;
                              })}
                            </div>
                          ))}
                        </div>
                        {m.role === 'assistant' && m.citations && (
                          <div className="mt-3 flex flex-wrap items-center gap-2 border-t border-cream-300 pt-2">
                            <span className="text-[10px] uppercase tracking-[.18em] text-slate-500">{t('chat.sources')}</span>
                            {m.citations.map((cid, i) => {
                              const p = getPiece(cid);
                              if (!p) return null;
                              return (
                                <button key={cid} onClick={() => setActivePiece(p)} className="inline-flex items-center gap-1 rounded-md border border-cream-400 px-2 py-0.5 text-xs hover:bg-cream-100">
                                  <span className="font-semibold text-rose-500">[{i+1}]</span>
                                  <span className="text-forest-800">{p.cote}</span>
                                  <span className="text-slate-400">·</span>
                                  <span className="max-w-[140px] truncate text-slate-600">{p.nom}</span>
                                </button>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    </div>
                  ))}

                  {/* streaming response */}
                  {streaming && (
                    <div className="flex justify-start anim-in">
                      <div className="max-w-[85%] rounded-2xl border border-cream-400 bg-white px-5 py-3 text-forest-800 shadow-soft">
                        <div className="text-sm leading-relaxed typing-cursor">
                          {formatChatBody(streamText).map(row => (
                            <div key={row.key}>
                              {row.parts.map((p, i) => {
                                if (typeof p === 'string') return <span key={i}>{p}</span>;
                                if (p.bold) return <strong key={i} className="font-semibold">{p.bold}</strong>;
                                if (p.italic) return <em key={i} className="italic">{p.italic}</em>;
                                if (p.cite !== undefined) return <span key={i} className="mx-0.5 rounded bg-rose-100 px-1 text-xs font-semibold text-rose-500">[{p.cite}]</span>;
                                return null;
                              })}
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
              <div className="border-t border-cream-400 bg-cream-50 px-8 py-4">
                <div className="mx-auto max-w-3xl">
                  <div className="flex items-end gap-2 rounded-xl border border-cream-400 bg-white px-3 py-2 shadow-soft focus-within:border-forest-300 focus-within:ring-2 focus-within:ring-forest-100">
                    <textarea rows="1" placeholder="Posez votre question juridique au cabinet…"
                      value={draft}
                      onChange={e => setDraft(e.target.value)}
                      onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}
                      className="flex-1 resize-none bg-transparent text-sm text-forest-800 placeholder:text-slate-400 focus:outline-none"/>
                    <button onClick={send} disabled={!draft || streaming} className="grid h-8 w-8 place-items-center rounded-lg bg-forest-700 text-cream-50 transition disabled:bg-cream-300 disabled:text-slate-400 hover:bg-forest-800">
                      <I.send className="h-4 w-4"/>
                    </button>
                  </div>
                  <div className="mt-2 flex flex-wrap gap-2">{PROJECT.chatSuggestions.map((s, i) => <button key={i} onClick={() => setDraft(t(`chat.${s}`))} className="rounded-full border border-cream-400 bg-cream-50 px-3 py-1 text-xs text-forest-800 hover:bg-white">{t(`chat.${s}`)}</button>)}</div>
                </div>
              </div>
            </div>
            <div className="col-span-1 flex h-full flex-col bg-cream-100">
              {activePiece ? (
                <div className="flex h-full flex-col">
                  <div className="border-b border-cream-400 bg-white px-5 py-4">
                    <div className="text-[10px] uppercase tracking-[.18em] text-slate-500">Source · {activePiece.cote}</div>
                    <div className="mt-1 font-serif text-base font-semibold text-forest-800">{activePiece.nom}</div>
                    <div className="mt-1 text-xs text-slate-500">{fmtDate(activePiece.date)} · {activePiece.intervenants.join(', ') || '—'}</div>
                  </div>
                  <div className="flex-1 space-y-4 overflow-y-auto p-5 text-sm scroll-area">
                    <p className="leading-relaxed text-forest-800">{activePiece.summary}</p>
                    {activePiece.extracts.length ? (
                      <div>
                        <div className="mb-2 text-[10px] uppercase tracking-[.18em] text-slate-500">{t('chat.cited')}</div>
                        {activePiece.extracts.map((e, i) => (
                          <blockquote key={i} className="mb-2 border-l-2 border-rose-300 bg-rose-50/40 px-3 py-2 font-serif text-sm italic text-forest-800">
                            <mark className="cite">{e}</mark>
                          </blockquote>
                        ))}
                      </div>
                    ) : null}
                  </div>
                  <div className="border-t border-cream-400 bg-white p-3">
                    <button onClick={() => openPiece(activePiece)} className="w-full rounded-lg border border-cream-400 px-3 py-2 text-xs font-medium text-forest-800 hover:bg-cream-100">
                      Voir la trace d’audit complète
                    </button>
                  </div>
                </div>
              ) : (
                <div className="flex h-full flex-col items-center justify-center px-6 text-center">
                  <div className="mb-3 grid h-12 w-12 place-items-center rounded-full bg-white text-slate-400 shadow-soft"><I.eye className="h-5 w-5"/></div>
                  <div className="font-serif text-lg font-semibold text-forest-800">{t('chat.source_preview')}</div>
                  <div className="mt-1 max-w-xs text-sm text-slate-500">{t('chat.click_cite')}</div>
                </div>
              )}
            </div>
          </div>
        );
      };

      // =============================================================
      // SYLLOGISME JURIDIQUE — THE WOW PAGE
      // =============================================================
      const SyllogismeStep = ({ idx, label, latin, sub, sources, body, color = 'forest', running, done }) => {
        const tones = {
          forest: { ring: 'ring-forest-200', icon: 'bg-forest-600 text-cream-50', label: 'text-forest-700', card: 'bg-white border-forest-100' },
          rose: { ring: 'ring-rose-200', icon: 'bg-rose-300 text-forest-800', label: 'text-rose-500', card: 'bg-white border-rose-100' },
          dark: { ring: 'ring-forest-300', icon: 'bg-forest-800 text-cream-50', label: 'text-forest-800', card: 'bg-cream-50 border-forest-200' }
        };
        const t = tones[color];
        return (
          <div className={`relative rounded-2xl border p-6 shadow-soft ${t.card} ${running ? 'ring-4 ' + t.ring : ''} ${done ? 'opacity-100' : !running ? 'opacity-40' : 'opacity-100'}`}>
            <div className="flex items-start gap-4">
              <div className="flex flex-col items-center gap-2">
                <div className={`grid h-10 w-10 place-items-center rounded-full font-serif text-sm font-bold ${t.icon}`}>{idx}</div>
                {running && <div className="h-3 w-3 rounded-full bg-rose-300 pulse-dot"/>}
              </div>
              <div className="flex-1 min-w-0">
                <div className="flex items-baseline justify-between">
                  <div>
                    <div className={`text-[10px] uppercase tracking-[.2em] ${t.label}`}>{label}</div>
                    <div className="font-serif text-xl font-semibold italic text-forest-800">{latin}</div>
                    <div className="text-xs text-slate-500">{sub}</div>
                  </div>
                  {sources && sources.length > 0 && (
                    <div className="flex flex-wrap items-center gap-1.5">
                      {sources.map((sid, i) => {
                        const p = getPiece(sid);
                        if (!p) return null;
                        return (
                          <span key={sid} className="inline-flex items-center gap-1 rounded-md border border-cream-400 bg-white px-2 py-0.5 text-[11px]">
                            <span className="font-semibold text-rose-500">[{i+1}]</span>
                            <span className="font-mono text-forest-800">{p.cote}</span>
                          </span>
                        );
                      })}
                    </div>
                  )}
                </div>
                {body && <p className="mt-3 font-serif text-[15px] leading-7 text-forest-800">{body}</p>}
                {running && !body && (
                  <div className="mt-3 space-y-2">
                    <div className="skeleton h-3 w-11/12 rounded"/>
                    <div className="skeleton h-3 w-9/12 rounded"/>
                    <div className="skeleton h-3 w-10/12 rounded"/>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      };

      const SyllogismePage = ({ openPiece }) => {
        const t = useT();
        const cases = PROJECT.syllogismes;
        const [activeId, setActiveId] = useState(cases[0].id);
        const [phase, setPhase] = useState(0); // 0=idle, 1=majeure running, 2=majeure done+mineure, 3=conclusion, 4=done
        const cur = cases.find(c => c.id === activeId);

        const run = () => {
          setPhase(1);
          setTimeout(() => setPhase(2), 1300);
          setTimeout(() => setPhase(3), 2700);
          setTimeout(() => setPhase(4), 4100);
        };

        useEffect(() => { setPhase(0); }, [activeId]);

        const riskTone = cur?.conclusion.risk === 'low' ? 'bg-forest-50 text-forest-700 border-forest-200' : cur?.conclusion.risk === 'medium' ? 'bg-amber-50 text-amber-800 border-amber-200' : 'bg-rose-50 text-rose-500 border-rose-200';
        const riskLabel = { low: t('syl.risk_low'), medium: t('syl.risk_medium'), high: t('syl.risk_high') }[cur?.conclusion.risk || 'low'];

        return (
          <div className="grid h-[calc(100vh-78px)] grid-cols-12 gap-0 anim-in">
            {/* left rail — case selector */}
            <div className="col-span-3 flex flex-col gap-3 overflow-y-auto border-r border-cream-400 bg-cream-100 p-5 scroll-area">
              <div>
                <div className="text-[10px] uppercase tracking-[.18em] text-slate-500">{t('syl.question_label')}</div>
                <div className="font-serif text-lg font-semibold text-forest-800">{t('syl.cases_title')}</div>
              </div>
              {cases.map((c, i) => (
                <button key={c.id} onClick={() => setActiveId(c.id)}
                  className={`rounded-xl border px-4 py-3 text-left transition ${activeId === c.id ? 'border-forest-600 bg-white shadow-soft' : 'border-cream-400 bg-white/60 hover:bg-white'}`}>
                  <div className="text-[10px] uppercase tracking-[.16em] text-slate-500">Cas {i+1}</div>
                  <div className="mt-1 font-serif text-sm leading-snug text-forest-800">{c.question}</div>
                </button>
              ))}
              <div className="mt-3 rounded-xl border border-rose-200 bg-rose-50/50 p-4">
                <div className="flex items-center gap-2">
                  <I.sparkles className="h-4 w-4 text-rose-500"/>
                  <div className="text-[10px] uppercase tracking-[.18em] text-rose-500 font-semibold">Comment ça marche</div>
                </div>
                <ul className="mt-2 space-y-1.5 text-xs text-forest-800 leading-relaxed">
                  <li>1. Récupération des règles applicables (RAG sur le corpus interne).</li>
                  <li>2. Qualification des faits du dossier.</li>
                  <li>3. Conclusion juridique sourcée + actions concrètes.</li>
                </ul>
                <div className="mt-3 text-[11px] text-slate-600 italic">{t('syl.assistive')}</div>
              </div>
            </div>

            {/* center — syllogism */}
            <div className="col-span-6 overflow-y-auto bg-cream-50 p-8 scroll-area">
              {/* Question hero */}
              <div className="rounded-2xl border border-forest-200 bg-gradient-to-br from-forest-700 via-forest-600 to-forest-500 p-6 text-cream-50 shadow-lift">
                <div className="flex items-start justify-between gap-4">
                  <div>
                    <div className="text-[10px] uppercase tracking-[.2em] text-rose-300">{t('syl.submitted')}</div>
                    <div className="mt-2 font-serif text-2xl leading-snug">{cur.question}</div>
                  </div>
                  <Btn variant="rose" icon={I.scale} onClick={run}>{phase === 0 ? t('syl.launch') : phase === 4 ? t('syl.replay') : t('syl.in_progress')}</Btn>
                </div>
                {phase > 0 && (
                  <div className="mt-4 flex items-center gap-2 text-[11px] text-cream-200/80">
                    <span className={`h-1.5 w-1.5 rounded-full ${phase < 4 ? 'bg-rose-300 pulse-dot' : 'bg-forest-200'}`}/>
                    {phase < 4 ? `${t('syl.step_in_progress')} ${phase}/3…` : `${t('syl.complete')} · ${cur.conclusion.actions.length} ${t('syl.actions_generated')}`}
                  </div>
                )}
              </div>

              {phase === 0 ? (
                <div className="mt-6 rounded-2xl border-2 border-dashed border-cream-400 bg-white/60 p-12 text-center">
                  <div className="mx-auto mb-3 grid h-12 w-12 place-items-center rounded-full bg-white text-forest-600 shadow-soft"><I.scale className="h-6 w-6"/></div>
                  <div className="font-serif text-lg text-forest-800">{t('syl.click_to_launch')} <strong>{t('syl.launch')}</strong> {t('syl.to_see')}</div>
                  <div className="mt-1 text-sm text-slate-500">Trois étapes : majeure (la règle) · mineure (les faits) · conclusion (l’avis sourcé).</div>
                </div>
              ) : (
                <div className="mt-6 space-y-4">
                  <SyllogismeStep
                    idx="I"
                    label={t('syl.majeure_label')}
                    latin="Praemissa major"
                    sub={t('syl.majeure_sub')}
                    color="forest"
                    sources={phase >= 2 ? cur.majeure.sources : null}
                    body={phase >= 2 ? cur.majeure.text : null}
                    running={phase === 1}
                    done={phase >= 2}
                  />
                  <SyllogismeStep
                    idx="II"
                    label={t('syl.mineure_label')}
                    latin="Praemissa minor"
                    sub={t('syl.mineure_sub')}
                    color="rose"
                    sources={phase >= 3 ? cur.mineure.sources : null}
                    body={phase >= 3 ? cur.mineure.text : null}
                    running={phase === 2}
                    done={phase >= 3}
                  />
                  <SyllogismeStep
                    idx="III"
                    label="Conclusion"
                    latin="Conclusio"
                    sub="L’avis du cabinet et les actions à conduire"
                    color="dark"
                    sources={null}
                    body={phase >= 4 ? cur.conclusion.text : null}
                    running={phase === 3}
                    done={phase >= 4}
                  />

                  {phase >= 4 && (
                    <div className="anim-pop rounded-2xl border-2 border-rose-300 bg-rose-50/40 p-6">
                      <div className="flex items-start justify-between">
                        <div>
                          <div className="text-[10px] uppercase tracking-[.18em] text-rose-500 font-semibold">{t('syl.synthesis_label')}</div>
                          <div className="font-serif text-xl text-forest-800">{t('syl.actions_title')}</div>
                        </div>
                        <span className={`rounded-full border px-3 py-1 text-[11px] font-semibold ${riskTone}`}>{riskLabel}</span>
                      </div>
                      <ol className="mt-4 space-y-2.5">
                        {cur.conclusion.actions.map((a, i) => (
                          <li key={i} className="flex items-start gap-3">
                            <span className="grid h-6 w-6 flex-shrink-0 place-items-center rounded-full bg-forest-600 text-[11px] font-semibold text-cream-50">{i+1}</span>
                            <span className="font-serif text-[15px] text-forest-800">{a}</span>
                          </li>
                        ))}
                      </ol>
                      <div className="mt-5 flex flex-wrap items-center justify-end gap-2">
                        <Btn variant="ghost" icon={I.download}>{t('syl.export_memo')}</Btn>
                        <Btn variant="ghost" icon={I.history}>Verser à l’audit</Btn>
                        <Btn variant="primary" icon={I.check}>{t('syl.validate_send')}</Btn>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>

            {/* right — sources panel */}
            <div className="col-span-3 flex flex-col gap-3 overflow-y-auto border-l border-cream-400 bg-white p-5 scroll-area">
              <div>
                <div className="text-[10px] uppercase tracking-[.18em] text-slate-500">{t('syl.sources_label')}</div>
                <div className="font-serif text-lg font-semibold text-forest-800">{t('syl.corpus_pieces')}</div>
              </div>
              {[...new Set([...(cur.majeure.sources || []), ...(cur.mineure.sources || [])])].map(sid => {
                const p = getPiece(sid);
                if (!p) return null;
                return (
                  <button key={sid} onClick={() => openPiece(p)} className="rounded-xl border border-cream-400 bg-cream-50 p-3 text-left hover:bg-white">
                    <div className="flex items-center gap-2">
                      <TypeIcon type={p.type} className="h-4 w-4 text-slate-500"/>
                      <span className="font-mono text-[11px] text-slate-500">{p.cote}</span>
                      <span className={`ml-auto rounded-md border px-2 py-0.5 text-[10px] ${getTheme(p.thematique).color}`}>{getTheme(p.thematique).label}</span>
                    </div>
                    <div className="mt-1 font-medium text-sm text-forest-800">{p.nom}</div>
                    <div className="mt-1 text-[11px] text-slate-500 line-clamp-2">{p.summary}</div>
                    <ConfidenceBar value={p.confidence}/>
                  </button>
                );
              })}
              <div className="mt-2 rounded-xl border border-cream-400 bg-cream-100 p-3 text-[11px] leading-relaxed text-slate-600">
                <div className="mb-1 flex items-center gap-1.5 font-semibold text-forest-800">
                  <I.shield className="h-3.5 w-3.5"/>Garanties
                </div>
                Les fragments envoyés au LLM ne dépassent jamais 2 000 tokens. Les embeddings restent locaux. Le raisonnement est journalisé dans l’audit trail immuable.
              </div>
            </div>
          </div>
        );
      };

      // =============================================================
      // GENERATE — drafting page (improved)
      // =============================================================
      const GeneratePage = () => {
        const t = useT();
        const [tplId, setTplId] = useState(PROJECT.templates[0].id);
        const [authorId, setAuthorId] = useState(PROJECT.lawyers[0].id);
        const [generated, setGenerated] = useState(false);
        const [generating, setGenerating] = useState(false);
        const tpl = PROJECT.templates.find(tp => tp.id === tplId);
        const lawyer = PROJECT.lawyers.find(l => l.id === authorId);

        const launch = () => {
          setGenerating(true);
          setGenerated(false);
          setTimeout(() => { setGenerating(false); setGenerated(true); }, 1600);
        };

        return (
          <div className="grid h-[calc(100vh-78px)] grid-cols-12 gap-0 anim-in">
            <div className="col-span-3 space-y-5 overflow-y-auto border-r border-cream-400 bg-cream-50 p-5 scroll-area">
              <div>
                <div className="mb-1.5 text-[10px] font-medium uppercase tracking-[.18em] text-slate-500">Modèle d’acte</div>
                <div className="space-y-1.5">{PROJECT.templates.map(t => (
                  <button key={t.id} onClick={() => setTplId(t.id)} className={`w-full rounded-lg border px-3 py-2 text-left transition ${tplId === t.id ? 'border-forest-600 bg-white shadow-soft' : 'border-cream-400 hover:bg-white'}`}>
                    <div className="text-sm font-medium text-forest-800">{t(tpl2.labelKey)}</div>
                    <div className="mt-0.5 text-[11px] leading-snug text-slate-500">{t(tpl2.descKey)}</div>
                  </button>
                ))}</div>
              </div>
              <div>
                <div className="mb-1.5 text-[10px] font-medium uppercase tracking-[.18em] text-slate-500">{t('gen.style_label')}</div>
                <div className="space-y-1.5">{PROJECT.lawyers.map(l => (
                  <button key={l.id} onClick={() => setAuthorId(l.id)} className={`w-full rounded-lg border px-3 py-2 text-left transition ${authorId === l.id ? 'border-forest-600 bg-white shadow-soft' : 'border-cream-400 hover:bg-white'}`}>
                    <div className="text-sm font-medium text-forest-800">{l.label}</div>
                    <div className="mt-0.5 text-[11px] leading-snug text-slate-500">{t(l.styleKey)}</div>
                  </button>
                ))}</div>
              </div>
              <div className="rounded-lg border border-rose-200 bg-rose-50 p-3 text-xs leading-relaxed text-forest-800">
                <div className="mb-1 flex items-center gap-1.5 font-medium text-rose-500">
                  <I.info className="h-3.5 w-3.5"/>Brouillon assisté
                </div>
                L’IA propose un premier draft à 75–80 % exploitable. La rédaction finale et la validation partner restent des actes humains.
              </div>
              <Btn variant="primary" icon={I.wand} onClick={launch}>{generating ? t('gen.generating') : t('gen.generate')}</Btn>
            </div>
            <div className="col-span-9 overflow-y-auto bg-cream-100 scroll-area">
              <div className="mx-auto my-8 max-w-3xl rounded-2xl border border-cream-400 bg-white shadow-lift">
                <div className="border-b border-cream-400 px-10 py-6">
                  <div className="text-[10px] font-medium uppercase tracking-[.18em] text-slate-500">{tpl?.label} · {t('gen.style')} {lawyer?.label}</div>
                  <h2 className="mt-1 font-serif text-2xl font-semibold text-forest-800">{t('gen.nda_title')}</h2>
                  <div className="mt-2 text-xs text-slate-500">{t('gen.draft_date')} {new Date().toLocaleDateString()} {t('gen.citations_visible')}</div>
                </div>
                <div className="px-10 py-8 font-serif text-[15px] leading-7 text-forest-800">
                  {generating ? (
                    <div className="space-y-3">
                      <div className="skeleton h-5 w-7/12 rounded"/>
                      <div className="skeleton h-3 w-11/12 rounded"/>
                      <div className="skeleton h-3 w-10/12 rounded"/>
                      <div className="skeleton h-3 w-9/12 rounded"/>
                      <div className="mt-6 skeleton h-5 w-6/12 rounded"/>
                      <div className="skeleton h-3 w-11/12 rounded"/>
                      <div className="skeleton h-3 w-9/12 rounded"/>
                    </div>
                  ) : !generated ? (
                    <div className="rounded-lg border-2 border-dashed border-cream-400 bg-cream-50 px-6 py-12 text-center">
                      <div className="mx-auto mb-2 grid h-10 w-10 place-items-center rounded-full bg-white text-slate-400 shadow-soft"><I.wand className="h-5 w-5"/></div>
                      <div className="text-sm text-slate-600">{t('gen.select_template')} <strong>{t('gen.generate_word')}</strong>.</div>
                      <div className="mt-1 text-xs text-slate-500">Le brouillon s’affichera ici, avec ses sources internes et un footer de validation.</div>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      {PROJECT.draftBlocks.map((b, i) => b.kind === 'h2' ? (
                        <h3 key={i} className="mt-6 font-serif text-lg font-semibold text-forest-800">{b.text}</h3>
                      ) : (
                        <div key={i} className="group relative">
                          <p className="text-justify">
                            {b.text}
                            {b.sources.map((s, j) => (
                              <sup key={s} className="ml-0.5 rounded bg-rose-100 px-1 text-xs font-semibold text-rose-500" title={getPiece(s)?.nom}>{j+1}</sup>
                            ))}
                          </p>
                          {b.sources.length > 0 && (
                            <div className="hover-source pointer-events-none absolute -right-44 top-0 w-40 opacity-0 transition group-hover:opacity-100">
                              {b.sources.map((s, j) => {
                                const p = getPiece(s);
                                return (
                                  <div key={s} className="mb-1 rounded-md border border-cream-400 bg-white p-2 text-[11px] shadow-soft">
                                    <div className="font-sans font-medium text-rose-500">[{j+1}] {p?.cote}</div>
                                    <div className="truncate font-sans text-slate-600">{p?.nom}</div>
                                  </div>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                {generated && (
                  <div className="flex items-center justify-between border-t border-cream-400 bg-cream-50/60 px-10 py-4 text-xs">
                    <div className="text-slate-600">{t('gen.footer_note')}</div>
                    <div className="flex gap-2">
                      <Btn variant="ghost" icon={I.download}>Word</Btn>
                      <Btn variant="ghost" icon={I.download}>PDF</Btn>
                      <Btn variant="primary" icon={I.check}>{t('gen.validate')}</Btn>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      };

      // =============================================================
      // APP
      // =============================================================
      const App = () => {
        const [splash, setSplash] = useState(true);
        const [view, setView] = useState('dashboard');
        const [auditPiece, setAuditPiece] = useState(null);
        const [lang, setLang] = useState('fr');

        const page = {
          dashboard: <Dashboard setView={setView} openPiece={setAuditPiece}/>,
          pipeline: <PipelineLive/>,
          import: <ImportPage/>,
          table: <TablePage openPiece={setAuditPiece}/>,
          chat: <ChatPage openPiece={setAuditPiece}/>,
          syllogisme: <SyllogismePage openPiece={setAuditPiece}/>,
          generate: <GeneratePage/>
        }[view];

        return (
          <LangContext.Provider value={lang}>
            {splash && <Splash onEnter={() => setSplash(false)} lang={lang} setLang={setLang}/>}
            <div className="flex h-screen overflow-hidden">
              <Sidebar view={view} setView={setView}/>
              <div className="flex flex-1 flex-col overflow-hidden">
                <HeaderBar view={view} lang={lang} setLang={setLang}/>
                <div className="flex-1 overflow-y-auto scroll-area bg-cream-100">{page}</div>
              </div>
              <AuditDrawer piece={auditPiece} onClose={() => setAuditPiece(null)}/>
            </div>
          </LangContext.Provider>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
  </body>
</html>
