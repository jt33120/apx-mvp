        const [backendOk, setBackendOk]     = useState(null); // null=unknown, true, false

        const filtered = filter === 'all' ? projectData.pieces : projectData.pieces.filter((p) => p.status === filter);

        // Vérifie si le backend tourne au montage du composant
        useEffect(() => {
          const ctrl = new AbortController();
          const tid  = setTimeout(() => ctrl.abort(), 1500);
          fetch(`${API_BASE}/health`, { signal: ctrl.signal })
            .then(r => { clearTimeout(tid); r.ok ? setBackendOk(true) : setBackendOk(false); })
            .catch(() => setBackendOk(false));
        }, []);

        async function runRealProcessing() {
          setProcessing(true);
          setApiError(null);
          setApiResults(null);
          try {
            const resp = await fetch(`${API_BASE}/process`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ folder_path: null }) // null = dossier par défaut côté backend
            });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error || 'Erreur serveur');
            setApiResults(data);
            setBackendOk(true);
          } catch (e) {
            setApiError(e.message);
            setBackendOk(false);
          } finally {
            setProcessing(false);
          }

                <div className="flex items-center gap-1.5 text-xs text-slate-500">
                  <span className={`h-1.5 w-1.5 rounded-full ${backendOk === true ? 'bg-emerald-500 pulse-dot' : backendOk === false ? 'bg-red-400' : 'bg-slate-300'}`} />
                  {backendOk === true ? 'Backend connecté ✓' : backendOk === false ? 'Backend hors-ligne' : 'Vérification…'}
                </div>
              </div>
              <div className="max-h-[520px] divide-y divide-slate-100 overflow-y-auto scroll-area">
                {filtered.map((p) => (
                  <button key={p.id} onClick={() => openPiece(p)} className="grid w-full grid-cols-12 items-center gap-3 px-6 py-3 text-left text-sm hover:bg-slate-50">
                    <div className="col-span-1 text-xs tabular-nums text-slate-500">{p.cote}</div>
                    <div className="col-span-4 flex min-w-0 items-center gap-2"><TypeIcon type={p.type} className="h-4 w-4 flex-shrink-0 text-slate-500" /><span className="truncate font-medium text-slate-800">{p.nom}</span></div>
                    <div className="col-span-2 tabular-nums text-slate-500">{fmtDate(p.date)}</div>
                    <div className="col-span-2"><span className={`rounded-md border px-2 py-0.5 text-xs ${getTheme(projectData, p.thematique).color}`}>{getTheme(projectData, p.thematique).label}</span></div>
                    <div className="col-span-1"><StatusPill status={p.status} /></div>
                    <div className="col-span-2 flex items-center justify-end gap-2"><ConfidenceBar value={p.confidence} /><I.eye className="h-4 w-4 text-slate-400" /></div>
                  </button>
                ))}
              </div>
            </div>
          </div>
        );
      };

      const EditableCell = ({ value, onSave, multiline }) => {
        const [editing, setEditing] = useState(false);
        const [draft, setDraft] = useState(value);
        const [flash, setFlash] = useState(false);
        const ref = useRef(null);

        useEffect(() => setDraft(value), [value]);
        useEffect(() => {
          if (editing && ref.current) {
            ref.current.focus();
            ref.current.select?.();
          }
        }, [editing]);

        const commit = () => {
          if (draft !== value) {
            onSave(draft);
            setFlash(true);
            setTimeout(() => setFlash(false), 800);
          }
          setEditing(false);
        };

        if (editing) {
          if (multiline) {
            return <textarea ref={ref} className="cell-edit w-full resize-none bg-transparent text-sm text-slate-800" rows="2" value={draft} onChange={(e) => setDraft(e.target.value)} onBlur={commit} onKeyDown={(e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) commit(); if (e.key === 'Escape') { setDraft(value); setEditing(false); } }} />;
          }
          return <input ref={ref} className="cell-edit w-full bg-transparent text-sm text-slate-800" value={draft} onChange={(e) => setDraft(e.target.value)} onBlur={commit} onKeyDown={(e) => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') { setDraft(value); setEditing(false); } }} />;
        }
        return <div onClick={() => setEditing(true)} className={`-mx-1 cursor-text rounded px-1 transition hover:bg-amber-50/50 ${flash ? 'ring-2 ring-emerald-300 ring-offset-1' : ''}`} title="Cliquez pour éditer">{value || <span className="text-slate-300">—</span>}</div>;
      };

      const TablePage = ({ projectId, projectData, openPiece }) => {
        const [rows, setRows] = useState(() => loadJson(storageKey(projectId, 'rows'), projectData.pieces.filter((p) => p.status !== 'rebut').map((p) => ({ ...p, contenuShort: p.summary }))));
        const [history, setHistory] = useState(() => loadJson(storageKey(projectId, 'history'), []));
        const [thFilter, setThFilter] = useState('all');
        const [search, setSearch] = useState('');

        useEffect(() => {
          setRows(loadJson(storageKey(projectId, 'rows'), projectData.pieces.filter((p) => p.status !== 'rebut').map((p) => ({ ...p, contenuShort: p.summary }))));
          setHistory(loadJson(storageKey(projectId, 'history'), []));
          setThFilter('all');
          setSearch('');
        }, [projectId]);

        useEffect(() => saveJson(storageKey(projectId, 'rows'), rows), [projectId, rows]);
        useEffect(() => saveJson(storageKey(projectId, 'history'), history), [projectId, history]);

        const filtered = useMemo(() => rows.filter((r) => (thFilter === 'all' || r.thematique === thFilter) && (!search || r.nom.toLowerCase().includes(search.toLowerCase()) || r.contenuShort.toLowerCase().includes(search.toLowerCase()))), [rows, thFilter, search]);
        const updateRow = (id, key, value) => {
          setRows((rs) => rs.map((r) => {
            if (r.id !== id) return r;
            setHistory((h) => [{ ts: new Date().toLocaleTimeString('fr-FR'), rowId: id, cote: r.cote, key, prev: r[key], next: value }, ...h].slice(0, 8));
            return { ...r, [key]: value };
          }));
        };

        return (
          <div className="space-y-4 p-8 anim-in">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div>
                <div className="font-serif text-lg font-semibold text-brand-900">{projectData.tableLabel}</div>
                <div className="text-xs text-slate-500">{projectData.tableSubLabel}</div>
              </div>
              <div className="flex items-center gap-2">
                <input type="search" placeholder="Rechercher dans la table…" value={search} onChange={(e) => setSearch(e.target.value)} className="w-64 rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm placeholder:text-slate-400 focus:border-brand-400 focus:outline-none focus:ring-2 focus:ring-brand-100" />
                <ActionButton icon={I.download} title="Export illustratif uniquement">Export Excel <DemoTag /></ActionButton>
                <ActionButton icon={I.download} title="Export illustratif uniquement">Word <DemoTag /></ActionButton>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <button onClick={() => setThFilter('all')} className={`rounded-full border px-3 py-1 text-xs font-medium transition ${thFilter === 'all' ? 'border-brand-700 bg-brand-700 text-white' : 'border-slate-300 bg-white text-slate-700 hover:bg-slate-50'}`}>Toutes thématiques</button>
              {projectData.thematiques.filter((t) => t.id !== 'rebut').map((t) => (
                <button key={t.id} onClick={() => setThFilter(t.id)} className={`rounded-full border px-3 py-1 text-xs font-medium transition ${thFilter === t.id ? `${t.color} border-current` : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'}`}>
                  {t.label}<span className="ml-1.5 tabular-nums opacity-60">{rows.filter((r) => r.thematique === t.id).length}</span>
                </button>
              ))}
            </div>

            <div className="overflow-hidden rounded-xl border border-slate-200 bg-white">
              <div className="overflow-x-auto scroll-area">
                <table className="w-full text-sm">
                  <thead className="bg-slate-50 text-[11px] uppercase tracking-wider text-slate-600">
                    <tr>
                      <th className="w-16 px-4 py-3 text-left font-medium">Cote</th>
                      <th className="w-28 px-4 py-3 text-left font-medium">Date</th>
                      <th className="px-4 py-3 text-left font-medium">Pièce</th>
                      <th className="w-44 px-4 py-3 text-left font-medium">Intervenants</th>
                      <th className="px-4 py-3 text-left font-medium">Contenu (sommaire)</th>
                      <th className="w-44 px-4 py-3 text-left font-medium">Thématique</th>
                      <th className="w-20 px-4 py-3 text-right font-medium">Audit</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {filtered.map((r) => {
                      const theme = getTheme(projectData, r.thematique);
                      return (
                        <tr key={r.id} className="hover:bg-slate-50/50">
                          <td className="px-4 py-3 align-top"><EditableCell value={r.cote} onSave={(v) => updateRow(r.id, 'cote', v)} /></td>
                          <td className="px-4 py-3 align-top tabular-nums text-slate-600">{fmtDate(r.date)}</td>
                          <td className="px-4 py-3 align-top"><div className="flex items-center gap-2"><TypeIcon type={r.type} className="h-4 w-4 flex-shrink-0 text-slate-400" /><span className="font-medium text-slate-800">{r.nom}</span></div></td>
                          <td className="px-4 py-3 align-top"><div className="flex flex-wrap gap-1">{r.intervenants.slice(0, 3).map((i) => <span key={i} className="rounded bg-slate-100 px-1.5 py-0.5 text-xs text-slate-700">{i}</span>)}</div></td>
                          <td className="max-w-md px-4 py-3 align-top"><EditableCell value={r.contenuShort} onSave={(v) => updateRow(r.id, 'contenuShort', v)} multiline /></td>
                          <td className="px-4 py-3 align-top">
                            <select value={r.thematique} onChange={(e) => updateRow(r.id, 'thematique', e.target.value)} className={`rounded-md border px-2 py-1 text-xs font-medium ${theme.color} focus:outline-none`}>
                              {projectData.thematiques.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}
                            </select>
                          </td>
                          <td className="px-4 py-3 align-top text-right"><button onClick={() => openPiece(r)} className="inline-flex items-center gap-1 rounded-md border border-slate-200 px-2 py-1 text-xs text-slate-700 hover:bg-slate-50"><I.eye className="h-3.5 w-3.5" />Voir</button></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              <div className="border-t border-slate-200 bg-slate-50/60 px-4 py-2 text-xs text-slate-600">{filtered.length} lignes affichées · edits persistés localement · aucune régénération destructive</div>
            </div>

            {history.length > 0 ? (
              <div className="rounded-xl border border-slate-200 bg-white p-4">
                <div className="mb-2 flex items-center gap-2"><I.history className="h-4 w-4 text-slate-500" /><div className="text-sm font-medium text-slate-700">Historique local de modifications</div></div>
                <ul className="space-y-1 text-xs text-slate-600">
                  {history.map((h, i) => <li key={i} className="flex items-baseline gap-2"><span className="tabular-nums text-slate-400">{h.ts}</span><span className="font-medium text-slate-700">{h.cote} · {h.key}</span><span className="text-slate-400">{(h.prev || '—').toString().slice(0, 40)}</span><span className="text-slate-400">→</span><span className="text-emerald-700">{(h.next || '—').toString().slice(0, 60)}</span></li>)}
                </ul>
              </div>
            ) : null}
          </div>
        );
      };

      const formatChatBody = (text) => text.split('\n').map((line, i) => {
        const parts = [];
        let lastIdx = 0;
        const re = /\[(\d+)\]|\*\*(.+?)\*\*/g;
        let m;
        while ((m = re.exec(line)) !== null) {
          if (m.index > lastIdx) parts.push(line.slice(lastIdx, m.index));
          if (m[1] !== undefined) parts.push({ cite: parseInt(m[1], 10) });
          else parts.push({ bold: m[2] });
          lastIdx = re.lastIndex;
        }
        if (lastIdx < line.length) parts.push(line.slice(lastIdx));
        return { key: i, parts };
      });

      const ChatPage = ({ projectData, openPiece }) => {
        const [draft, setDraft] = useState('');
        const [activePiece, setActivePiece] = useState(null);
        return (
          <div className="grid h-[calc(100vh-78px)] grid-cols-3 gap-0 anim-in">
            <div className="col-span-2 flex flex-col border-r border-slate-200 bg-white">
              <div className="flex-1 overflow-y-auto px-8 py-6 scroll-area">
                <div className="mx-auto max-w-3xl space-y-6">
                  <div className="rounded-xl border border-brand-200 bg-brand-50/40 px-4 py-3 text-sm text-brand-900">
                    <div className="flex items-center gap-2 font-medium"><I.shield className="h-4 w-4" />{projectData.chatBannerTitle}</div>
                    <div className="mt-1 text-xs text-brand-700">{projectData.chatBannerNote}</div>
                  </div>
                  {projectData.chatHistory.map((m, idx) => (
                    <div key={idx} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div className={`max-w-[85%] rounded-2xl px-5 py-3 ${m.role === 'user' ? 'bg-brand-900 text-white' : 'border border-slate-200 bg-white text-slate-800'}`}>
                        <div className="whitespace-pre-wrap text-sm leading-relaxed">
                          {formatChatBody(m.content).map((row) => (
                            <div key={row.key}>
                              {row.parts.map((p, i) => {
                                if (typeof p === 'string') return <span key={i}>{p}</span>;
                                if (p.bold) return <strong key={i} className="font-semibold">{p.bold}</strong>;
                                if (p.cite !== undefined) {
                                  const cid = m.citations?.[p.cite - 1];
                                  const piece = cid ? getPiece(projectData, cid) : null;
                                  return <button key={i} onClick={() => piece && setActivePiece(piece)} className={`mx-0.5 inline-flex items-baseline rounded px-1 py-0 text-xs font-semibold ${m.role === 'user' ? 'bg-white/20' : 'bg-amber-100 text-amber-900 hover:bg-amber-200'}`}>[{p.cite}]</button>;
                                }
                                return null;
                              })}
                            </div>
                          ))}
                        </div>
                        {m.role === 'assistant' && m.citations ? (
                          <div className="mt-3 flex flex-wrap items-center gap-2 border-t border-slate-200 pt-2">
                            <span className="text-[11px] uppercase tracking-wider text-slate-500">Sources</span>
                            {m.citations.map((cid, i) => {
                              const p = getPiece(projectData, cid);
                              if (!p) return null;
                              return <button key={cid} onClick={() => setActivePiece(p)} className="inline-flex items-center gap-1 rounded-md border border-slate-200 px-2 py-0.5 text-xs hover:bg-slate-50"><span className="font-semibold text-amber-700">[{i + 1}]</span><span className="text-slate-700">{p.cote}</span><span className="text-slate-400">·</span><span className="max-w-[120px] truncate text-slate-600">{p.nom}</span></button>;
                            })}
                          </div>
                        ) : null}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
              <div className="border-t border-slate-200 bg-white px-8 py-4">
                <div className="mx-auto max-w-3xl">
                  <div className="flex items-end gap-2 rounded-xl border border-slate-300 bg-white px-3 py-2 focus-within:border-brand-400 focus-within:ring-2 focus-within:ring-brand-100">
                    <textarea rows="1" placeholder={projectData.chatPlaceholder} value={draft} onChange={(e) => setDraft(e.target.value)} className="flex-1 resize-none bg-transparent text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none" />
                    <button disabled={!draft} title="Champ interactif illustratif" className="grid h-8 w-8 place-items-center rounded-lg bg-brand-900 text-white disabled:bg-slate-200 disabled:text-slate-400"><I.send className="h-4 w-4" /></button>
                  </div>
                  <div className="mt-2 flex flex-wrap gap-2">{projectData.chatSuggestions.map((s, i) => <button key={i} onClick={() => setDraft(s)} className="rounded-full border border-slate-200 bg-slate-50 px-3 py-1 text-xs text-slate-600 hover:bg-white">{s}</button>)}</div>
                </div>
              </div>
            </div>
            <div className="col-span-1 flex h-full flex-col bg-slate-50/60">
              {activePiece ? (
                <div className="flex h-full flex-col">
                  <div className="border-b border-slate-200 bg-white px-5 py-4">
                    <div className="text-[11px] uppercase tracking-wider text-slate-500">Source · {activePiece.cote}</div>
                    <div className="mt-1 font-serif text-base font-semibold text-brand-900">{activePiece.nom}</div>
                    <div className="mt-1 text-xs text-slate-500">{fmtDate(activePiece.date)} · {activePiece.intervenants.join(', ') || '—'}</div>
                  </div>
                  <div className="flex-1 space-y-4 overflow-y-auto p-5 text-sm scroll-area">
                    <p className="leading-relaxed text-slate-700">{activePiece.summary}</p>
                    {activePiece.extracts.length ? <div><div className="mb-2 text-[11px] uppercase tracking-wider text-slate-500">Extraits cités</div>{activePiece.extracts.map((e, i) => <blockquote key={i} className="mb-2 border-l-2 border-amber-300 bg-amber-50/40 px-3 py-2 font-serif text-sm italic text-slate-700"><mark className="cite">{e}</mark></blockquote>)}</div> : null}
                  </div>
                  <div className="border-t border-slate-200 bg-white p-3"><button onClick={() => openPiece(activePiece)} className="w-full rounded-lg border border-slate-200 px-3 py-2 text-xs font-medium text-slate-700 hover:bg-slate-50">Voir la trace d’audit</button></div>
                </div>
              ) : (
                <div className="flex h-full flex-col items-center justify-center px-6 text-center">
                  <div className="mb-3 grid h-12 w-12 place-items-center rounded-full bg-white text-slate-400 shadow-sm"><I.eye className="h-5 w-5" /></div>
                  <div className="font-serif text-lg font-semibold text-brand-900">Aperçu source</div>
                  <div className="mt-1 max-w-xs text-sm text-slate-500">{projectData.sourceEmpty}</div>
                </div>
              )}
            </div>
          </div>
        );
      };

      const GeneratePage = ({ projectData }) => {
        const [tplId, setTplId] = useState(projectData.templates[0].id);
        const [authorId, setAuthorId] = useState(projectData.lawyers[0].id);
        const [generated, setGenerated] = useState(false);
        useEffect(() => {
          setTplId(projectData.templates[0].id);
          setAuthorId(projectData.lawyers[0].id);
          setGenerated(false);
        }, [projectData.id]);
        const tpl = projectData.templates.find((t) => t.id === tplId);
        const lawyer = projectData.lawyers.find((l) => l.id === authorId);
        return (
          <div className="grid h-[calc(100vh-78px)] grid-cols-12 gap-0 anim-in">
            <div className="col-span-3 space-y-5 overflow-y-auto border-r border-slate-200 bg-white p-5 scroll-area">
              <div>
                <div className="mb-1.5 text-[11px] font-medium uppercase tracking-wider text-slate-500">Modèle</div>
                <div className="space-y-1.5">{projectData.templates.map((t) => <button key={t.id} onClick={() => setTplId(t.id)} className={`w-full rounded-lg border px-3 py-2 text-left transition ${tplId === t.id ? 'border-brand-700 bg-brand-50/40' : 'border-slate-200 hover:bg-slate-50'}`}><div className="text-sm font-medium text-slate-800">{t.label}</div><div className="mt-0.5 text-[11px] leading-snug text-slate-500">{t.desc}</div></button>)}</div>
              </div>
              <div>
                <div className="mb-1.5 text-[11px] font-medium uppercase tracking-wider text-slate-500">Style</div>
                <div className="space-y-1.5">{projectData.lawyers.map((l) => <button key={l.id} onClick={() => setAuthorId(l.id)} className={`w-full rounded-lg border px-3 py-2 text-left transition ${authorId === l.id ? 'border-brand-700 bg-brand-50/40' : 'border-slate-200 hover:bg-slate-50'}`}><div className="text-sm font-medium text-slate-800">{l.label}</div><div className="mt-0.5 text-[11px] leading-snug text-slate-500">{l.style}</div></button>)}</div>
              </div>
              <div className="rounded-lg border border-amber-200 bg-amber-50 p-3 text-xs leading-relaxed text-amber-900"><div className="mb-1 flex items-center gap-1.5 font-medium"><I.info className="h-3.5 w-3.5" />Brouillon assisté</div>{projectData.generateNotice}</div>
              <ActionButton variant="primary" icon={I.wand} onClick={() => setGenerated(true)}>{projectData.generateButton}</ActionButton>
            </div>
            <div className="col-span-9 overflow-y-auto bg-slate-100/40 scroll-area">
              <div className="mx-auto my-8 max-w-3xl rounded-xl border border-slate-200 bg-white shadow-sm">
                <div className="border-b border-slate-200 px-10 py-6">
                  <div className="text-[11px] font-medium uppercase tracking-wider text-slate-500">{tpl?.label} · Style {lawyer?.label}</div>
                  <h2 className="mt-1 font-serif text-2xl font-semibold text-brand-900">{projectData.draftTitle}</h2>
                  <div className="mt-2 text-xs text-slate-500">Brouillon de démonstration généré le {new Date().toLocaleDateString('fr-FR')} · citations visibles en marge</div>
                </div>
                <div className="px-10 py-8 font-serif text-[15px] leading-7 text-slate-800">
                  {!generated ? (
                    <div className="rounded-lg border-2 border-dashed border-slate-200 bg-slate-50/50 px-6 py-12 text-center">
                      <div className="mx-auto mb-2 grid h-10 w-10 place-items-center rounded-full bg-white text-slate-400"><I.wand className="h-5 w-5" /></div>
                      <div className="text-sm text-slate-600">Sélectionnez un modèle et un style, puis cliquez sur <strong>Simuler</strong>.</div>
                      <div className="mt-1 text-xs text-slate-500">Le brouillon illustratif s’affichera ici, avec ses sources.</div>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      {projectData.draftBlocks.map((b, i) => b.kind === 'h2' ? <h3 key={i} className="mt-6 font-serif text-lg font-semibold text-brand-900">{b.text}</h3> : <div key={i} className="group relative"><p className="text-justify">{b.text}{b.sources.map((s, j) => <sup key={s} className="ml-0.5 rounded bg-amber-100 px-1 text-xs font-semibold text-amber-800" title={getPiece(projectData, s)?.nom}>{j + 1}</sup>)}</p>{b.sources.length ? <div className="pointer-events-none absolute -right-44 top-0 w-40 opacity-0 transition group-hover:opacity-100">{b.sources.map((s, j) => { const p = getPiece(projectData, s); return <div key={s} className="mb-1 rounded-md border border-slate-200 bg-white p-2 text-[11px] shadow-sm"><div className="font-sans font-medium text-amber-700">[{j + 1}] {p?.cote}</div><div className="truncate font-sans text-slate-600">{p?.nom}</div></div>; })}</div> : null}</div>)}
                    </div>
                  )}
                </div>
                {generated ? (
                  <div className="flex items-center justify-between border-t border-slate-200 bg-slate-50/60 px-10 py-4 text-xs">
                    <div className="text-slate-600">{projectData.footerStats}</div>
                    <div className="flex gap-2">
                      <ActionButton icon={I.download} title="Export illustratif uniquement">Word <DemoTag /></ActionButton>
                      <ActionButton icon={I.download} title="Export illustratif uniquement">PDF <DemoTag /></ActionButton>
                      <ActionButton icon={I.check} variant="success" title="Validation illustrative uniquement">Valider <DemoTag /></ActionButton>
                    </div>
                  </div>
                ) : null}
              </div>
            </div>
          </div>
        );
      };

      const App = () => {
        const projectId = 'pp'; // scénario isolé
        const [view, setView] = useState('dashboard');
        const [auditPiece, setAuditPiece] = useState(null);
        const projectData = DATA[projectId];

        const page = {
          dashboard: <DashboardPage projectData={projectData} setView={setView} openPiece={setAuditPiece} />,
          import: <ImportPage projectData={projectData} openPiece={setAuditPiece} />,
          table: <TablePage projectId={projectId} projectData={projectData} openPiece={setAuditPiece} />,
          chat: <ChatPage projectData={projectData} openPiece={setAuditPiece} />,
          generate: <GeneratePage projectData={projectData} />
        }[view];

        return (
          <div className="flex h-screen overflow-hidden">
            <Sidebar projectId={projectId} view={view} setView={setView} />
            <div className="flex flex-1 flex-col overflow-hidden">
              <Header projectId={projectId} view={view} />
              <div className="flex-1 overflow-y-auto scroll-area">{page}</div>
            </div>
            <AuditDrawer projectData={projectData} piece={auditPiece} onClose={() => setAuditPiece(null)} />
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
