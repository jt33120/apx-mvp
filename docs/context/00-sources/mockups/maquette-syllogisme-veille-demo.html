<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lexoria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f1efe9;
      --sidebar-bg: #18293c;
      --sidebar-hover: rgba(255,255,255,0.065);
      --sidebar-active-bg: rgba(255,255,255,0.11);
      --sidebar-border: rgba(255,255,255,0.07);
      --panel: #ffffff;
      --panel-warm: #faf8f4;
      --panel-subtle: #f5f3ef;
      --line: #e5e0d6;
      --line-soft: #ede9e2;
      --text: #1b2a38;
      --text-2: #3c4f61;
      --muted: #8090a2;
      --brand: #1b3352;
      --brand-2: #254d74;
      --accent: #b8924a;
      --accent-soft: #faf3e5;
      --accent-border: #dfc999;
      --green: #0b7265;
      --green-soft: #e2f5f1;
      --green-border: #9fd4cc;
      --amber: #895018;
      --amber-soft: #fdf4e5;
      --amber-border: #e8c68a;
      --red: #8b1f1f;
      --red-soft: #fdf0f0;
      --red-border: #e8aaaa;
      --shadow-xs: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
      --shadow-sm: 0 2px 8px rgba(27,51,82,0.07), 0 1px 2px rgba(27,51,82,0.04);
      --shadow-md: 0 4px 16px rgba(27,51,82,0.08), 0 1px 4px rgba(27,51,82,0.04);
      --r-xs: 6px;
      --r-sm: 8px;
      --r: 12px;
      --r-lg: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1, h2, h3, h4, p { margin: 0; }

    /* ─────────── App shell ─────────── */
    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 252px 1fr;
    }

    /* ─────────── Sidebar ─────────── */
    .sidebar {
      background: var(--sidebar-bg);
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .sidebar-brand {
      padding: 22px 18px 18px;
      border-bottom: 1px solid var(--sidebar-border);
      flex-shrink: 0;
    }

    .brand-inner {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: linear-gradient(140deg, #c9a55a 0%, #dbbf7e 100%);
      display: grid;
      place-items: center;
      color: #18293c;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    .brand-name {
      font-size: 15.5px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      font-size: 10.5px;
      color: rgba(255,255,255,0.38);
      margin-top: 1px;
      line-height: 1.4;
    }

    /* Nav */
    .sidebar-nav {
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 1px;
      border-bottom: 1px solid var(--sidebar-border);
      flex-shrink: 0;
    }

    .nav-btn {
      border: 0;
      background: transparent;
      text-align: left;
      color: rgba(255,255,255,0.52);
      padding: 9px 10px;
      border-radius: var(--r-sm);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 9px;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .nav-btn .icon { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.6; }
    .nav-btn.active { background: var(--sidebar-active-bg); color: #ffffff; }
    .nav-btn.active .icon { opacity: 1; }
    .nav-btn:hover:not(.active) { background: var(--sidebar-hover); color: rgba(255,255,255,0.82); }

    /* Practices */
    .sidebar-section {
      padding: 14px 18px;
      border-bottom: 1px solid var(--sidebar-border);
      flex-shrink: 0;
    }

    .sidebar-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.26);
      margin-bottom: 9px;
    }

    .practice-list { display: flex; flex-direction: column; gap: 1px; }

    .practice-item {
      padding: 6px 8px;
      border-radius: var(--r-xs);
      font-size: 12.5px;
      color: rgba(255,255,255,0.48);
      cursor: default;
      transition: color 0.12s;
    }
    .practice-item:hover { color: rgba(255,255,255,0.72); }

    /* Shortcuts */
    .sidebar-shortcuts {
      padding: 14px 18px 20px;
      margin-top: auto;
      border-top: 1px solid var(--sidebar-border);
      flex-shrink: 0;
    }

    .shortcut-list { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }

    .shortcut-row {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 9px;
      align-items: flex-start;
    }

    .shortcut-n {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background: rgba(197,169,90,0.18);
      color: #d4b870;
      display: grid;
      place-items: center;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .shortcut-title { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.62); }
    .shortcut-text  { font-size: 11px; color: rgba(255,255,255,0.30); margin-top: 2px; line-height: 1.4; }

    /* ─────────── Main ─────────── */
    .main { min-width: 0; display: flex; flex-direction: column; }

    /* ─────────── Topbar ─────────── */
    .topbar {
      height: 60px;
      padding: 0 30px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      background: rgba(241,239,233,0.90);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 20;
    }

    .topbar-eyebrow {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1px;
    }

    .topbar-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--brand);
      letter-spacing: -0.02em;
    }

    .topbar-right { display: flex; align-items: center; gap: 7px; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
      font-size: 11.5px;
      font-weight: 400;
      color: var(--text-2);
      white-space: nowrap;
    }

    .s-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }

    .lang-toggle {
      display: inline-flex;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
    }

    .lang-toggle button {
      border: 0;
      background: transparent;
      border-radius: 999px;
      padding: 4px 10px;
      cursor: pointer;
      font: inherit;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--muted);
      transition: background 0.12s, color 0.12s;
    }

    .lang-toggle button.active { background: var(--brand); color: white; }

    /* ─────────── Content area ─────────── */
    .content { padding: 26px 30px 40px; }

    .tab-panel { display: grid; gap: 18px; }
    .hidden { display: none !important; }

    /* ─────────── Grids ─────────── */
    .g4    { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .g2    { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .g3-2  { display: grid; grid-template-columns: 3fr 2fr; gap: 18px; }
    .g2-3  { display: grid; grid-template-columns: 2fr 3fr; gap: 18px; }

    /* ─────────── Card ─────────── */
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-sm);
    }

    .cp  { padding: 22px 24px; }
    .cpl { padding: 26px 28px; }

    /* ─────────── Section head ─────────── */
    .sh {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 18px;
    }

    .sh-title {
      font-family: 'Lora', Georgia, 'Times New Roman', serif;
      font-size: 16.5px;
      font-weight: 600;
      color: var(--brand);
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    .sh-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.55;
    }

    /* ─────────── Badges ─────────── */
    .bd {
      display: inline-flex;
      align-items: center;
      font-size: 10.5px;
      font-weight: 500;
      border-radius: var(--r-xs);
      padding: 3px 8px;
      white-space: nowrap;
      letter-spacing: 0.01em;
    }

    .bd-outline { border: 1px solid var(--line); background: var(--panel-subtle); color: var(--text-2); }
    .bd-brand   { background: #e5eef7; color: var(--brand); }
    .bd-green   { background: var(--green-soft); color: var(--green); }
    .bd-amber   { background: var(--amber-soft); color: var(--amber); }
    .bd-red     { background: var(--red-soft);   color: var(--red); }
    .bd-accent  { background: var(--accent-soft); color: #6e4a18; border: 1px solid var(--accent-border); }

    /* ─────────── KPI stat card ─────────── */
    .kpi {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 16px 18px 15px;
      box-shadow: var(--shadow-xs);
    }

    .kpi-label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 9px;
    }

    .kpi-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--brand);
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 5px;
    }

    .kpi-sub { font-size: 11px; color: var(--muted); }

    /* ─────────── Activity feed ─────────── */
    .feed { display: flex; flex-direction: column; }

    .feed-row {
      display: flex;
      gap: 13px;
      align-items: flex-start;
      padding: 13px 0;
      border-bottom: 1px solid var(--line-soft);
    }

    .feed-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .feed-row:first-child { padding-top: 0; }

    .feed-pip {
      width: 7px; height: 7px;
      border-radius: 50%;
      margin-top: 5px;
      flex-shrink: 0;
    }

    .feed-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
    .feed-text  { font-size: 12px; color: var(--muted); line-height: 1.55; }

    /* ─────────── Document list (library) ─────────── */
    .doc-list { display: flex; flex-direction: column; gap: 8px; }

    .doc-row {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--r);
      background: var(--panel-warm);
      transition: border-color 0.12s;
    }

    .doc-row:hover { border-color: #ccc7bc; }

    .doc-ext {
      width: 30px; height: 30px;
      border-radius: 7px;
      background: var(--panel-subtle);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      font-size: 9.5px;
      font-weight: 700;
      color: var(--brand);
      flex-shrink: 0;
      letter-spacing: 0.02em;
    }

    .doc-name { font-size: 12.5px; font-weight: 500; color: var(--text); margin-bottom: 3px; }
    .doc-meta { font-size: 11.5px; color: var(--muted); line-height: 1.45; }

    /* ─────────── Numbered list (principles / guardrails) ─────────── */
    .num-list { display: flex; flex-direction: column; gap: 14px; }

    .num-row {
      display: grid;
      grid-template-columns: 26px 1fr;
      gap: 11px;
      align-items: flex-start;
    }

    .num-n {
      width: 26px; height: 26px;
      border-radius: 7px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: #6e4a18;
      display: grid;
      place-items: center;
      font-size: 10.5px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .num-title { font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .num-text  { font-size: 11.5px; color: var(--muted); line-height: 1.5; }

    /* ─────────── Research ─────────── */
    .q-box {
      background: var(--panel-subtle);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 14px 16px;
      margin-bottom: 14px;
    }

    .q-eyebrow {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .q-text { font-size: 13.5px; color: var(--text); line-height: 1.65; }

    .ans-wrap {
      border: 1px solid var(--accent-border);
      border-radius: var(--r);
      overflow: hidden;
    }

    .ans-head {
      padding: 9px 16px;
      background: #fdf5e4;
      border-bottom: 1px solid var(--accent-border);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #6e4a18;
    }

    .ans-body { background: #fffcf5; padding: 18px 20px; }

    .ans-summary {
      font-size: 13.5px;
      line-height: 1.72;
      color: var(--text);
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid #f0e8d2;
    }

    .ans-block { margin-bottom: 13px; }
    .ans-block:last-child { margin-bottom: 0; }

    .ans-block-label {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .ans-block-text { font-size: 12.5px; line-height: 1.65; color: var(--text-2); }

    .cit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 17px; height: 17px;
      border-radius: 50%;
      background: #d4bc96;
      color: #4a3010;
      font-size: 9.5px;
      font-weight: 700;
      margin: 0 1px;
      vertical-align: middle;
      position: relative;
      top: -1px;
    }

    /* ─────────── Sources panel ─────────── */
    .src-list { display: flex; flex-direction: column; gap: 9px; }

    .src-item {
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 13px 15px;
      background: var(--panel-warm);
    }

    .src-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }

    .src-name { font-size: 12.5px; font-weight: 600; color: var(--text); }

    .src-quote {
      font-size: 12px;
      font-style: italic;
      color: var(--text-2);
      line-height: 1.62;
      padding-left: 10px;
      border-left: 2.5px solid var(--accent-border);
    }

    .audit-card {
      background: var(--panel-subtle);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 14px 16px;
    }

    .audit-label {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .audit-text { font-size: 11.5px; color: var(--text-2); line-height: 1.7; }

    /* ─────────── Watch ─────────── */
    .alert-list { display: flex; flex-direction: column; gap: 10px; }

    .alert-card {
      border-radius: var(--r);
      padding: 15px 17px;
      border: 1px solid;
    }

    .alert-card.hi  { background: #fef5f5; border-color: var(--red-border); }
    .alert-card.mid { background: #fefdf2; border-color: var(--amber-border); }
    .alert-card.lo  { background: #f2faf8; border-color: var(--green-border); }

    .alert-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 7px;
    }

    .alert-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .alert-text  { font-size: 12.5px; color: var(--text-2); line-height: 1.6; }

    /* Weekly brief */
    .brief-list { display: flex; flex-direction: column; }

    .brief-row {
      padding: 13px 0;
      border-bottom: 1px solid var(--line-soft);
    }

    .brief-row:first-child { padding-top: 0; }
    .brief-row:last-child  { border-bottom: 0; padding-bottom: 0; }

    .brief-eyebrow {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .brief-text { font-size: 12.5px; color: var(--text-2); line-height: 1.6; }

    /* ─────────── Drafting ─────────── */
    .config-list { display: flex; flex-direction: column; gap: 8px; }

    .config-item {
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--r);
      background: var(--panel-warm);
    }

    .config-label {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .config-value { font-size: 12.5px; color: var(--text); line-height: 1.55; }

    /* Document editor area */
    .doc-editor {
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      overflow: hidden;
      background: var(--panel);
      box-shadow: var(--shadow-sm);
    }

    .doc-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: var(--panel-subtle);
      border-bottom: 1px solid var(--line);
      gap: 12px;
    }

    .doc-toolbar-left { font-size: 12px; font-weight: 600; color: var(--text-2); }
    .doc-toolbar-sub  { font-size: 10.5px; color: var(--muted); margin-top: 1px; }

    .doc-actions { display: flex; gap: 5px; }

    .doc-action-btn {
      padding: 4px 11px;
      border: 1px solid var(--line);
      border-radius: var(--r-xs);
      background: var(--panel);
      font: inherit;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-2);
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
    }

    .doc-action-btn:hover { background: var(--panel-subtle); border-color: #ccc7bc; }

    .doc-body { padding: 26px 30px 28px; }

    .doc-section {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eeebe5;
    }

    .doc-section:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }

    .doc-section-label {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .doc-section-text { font-size: 13.5px; line-height: 1.76; color: var(--text-2); }

    .review-callout {
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      border-radius: var(--r);
      padding: 13px 16px;
      margin-top: 0;
    }

    .review-callout .doc-section-label { color: #6e4a18; }
    .review-callout .doc-section-text  { color: #5c3e14; font-size: 13px; }

    /* ─────────── Responsive ─────────── */
    @media (max-width: 1280px) {
      .g4 { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 1060px) {
      .g3-2, .g2-3, .g2 { grid-template-columns: 1fr; }
    }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { height: auto; position: static; }
      .topbar { position: static; }
    }

    @media (max-width: 640px) {
      .content, .topbar { padding-left: 16px; padding-right: 16px; }
      .g4 { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar">

    <div class="sidebar-brand">
      <div class="brand-inner">
        <div class="logo-mark">LX</div>
        <div>
          <div class="brand-name">Lexoria</div>
          <div class="brand-sub" data-i18n="brandSubtitle"></div>
