nfirmation never named it — 5.8 had made exactly this argument for confirmed_count ('what the lawyer was SHOWN, not re-derived at the click') and the drawer's own button PRINTS the version while the request carried none; version_no is now required at the store, at all three routes and in the client. Also 104 -> 105 checks: validation-version-never-defaulted, scoped to the ACT (the two takers and their callers) because a default is honest on a READ — 37 functions in the tree default version_no and are right to — and dishonest only where the answer is written down as an acceptance; a check flagging every default would be answered by weakening it. Gate: 2 113 -> 2 141 tests, 105 checks, 3 contracts, fitness 6/7, client clean. Re-review sections with the coverage table appended to stories 5.6, 5.7 and 5.8. New item C9"
