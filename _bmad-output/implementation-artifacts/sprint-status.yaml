ion) and only for the matter's own chain. FR-53's first consequence had never been tested in any story: the harness makes the audit store read-only IN THE DATABASE and asserts the NEGATIVE half over the six named acts — the business row ABSENT. `AuditUnwritable` → one 503 handler for every route, reads still answering; contention deliberately excluded (AD-22's named trap). One door onto the store: the worker and both manage commands wrote the bulk of the record unjournalled, and `manage restore` skipped the continuity check in silence. 100 → 103 checks; the fitness frame stopped disclaiming the tail truncation and now asserts it with no store. Review: 6 lenses × 2 skeptics, 35 candidates, 26 refuted, 9 confirmed, 9 fixed — ONE LENS ERRORED and its coverage loss is stated in the story (retro A2).
