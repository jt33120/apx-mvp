  5-8-the-validation-act: done  # FR-45. The last gesture, and the one that could undo twelve stories: a record that cannot be forged is worth nothing if "a human read this" can be produced by a click-through — v1 sold that claim on a phrase, *validation act*, that no requirement created. FR-24 §611's two recorded things turned out to be the two pending export sections turned out to be TWO VERBS: `validate_piece` (class validation_act) and `values_accepted` (class value_accepted), written together in one transaction, the second with exactly one writer forever (only-the-validation-act-accepts) — because a second writer is not a duplicate but the DEFAULT FR-45 forbids by name. FR-45's load-bearing fact was recorded only as PROSE: every viewer open since 3.5 lived as `piece=<id>` inside an encrypted audit detail, so "did this lawyer open this pièce" meant decrypting every retrieval entry of the matter and parsing a fragment — migration 0036 gives it a ledger, with NO backfill (reconstructing it would manufacture rows out of a format that was never a contract, so a validation over a pre-0036 open honestly records `not opened`). opened_at is a TIMESTAMP, not a boolean: "ouverte" alone is equally true of an open six months and three rankings ago, and `Provenance` has no constructor taking a boolean so no call site can assert what it did not read. Four nearly-right referents, each with a test — opened by WHOM (another lawyer's open is not this lawyer's reading), WHEN (strictly before the act), WHICH (per pièce, never blanket over a batch — FR-45(c)), and accepted WHAT (a named version, so a re-rank makes it stale and invalidates nothing). Bulk permitted and impossible to hide: the confirmation states the count AND THE SPLIT, the verb names the count and is not initially focused. 97 → 100 checks; the 5.7 tripwires fired and were answered by REMOVAL, never by weakening — `a_pending_section_is_not_a_zero`'s "at least one pending" leg would have failed ON SUCCESS and is now a 