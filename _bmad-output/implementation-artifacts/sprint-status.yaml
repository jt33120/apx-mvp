    resolution: "b9-evidential-measurement-2026-08-15.md, instrument apx/timedrun/evidential.py + 6 tests. BOTH LINEAR, neither trips AD-44 at the design target. The batch: 1.19/1.22/1.23/1.13 ms per piece at n=100/425/1700/3400 — no super-linear term, peak RSS 133->159 MiB across a 34x growth; 1 700 pieces is ~2.1 s of held transaction, and contention is excluded from AuditUnwritable so a concurrent act WAITS rather than failing. The journal: ~4.5 us/line, 500 000 lines = 105 MiB parsed in 2.4 s, and it grows one line PER COMMIT AND CHAIN (not per entry — _write_heads keeps the highest seq per chain), so the 1 700-piece batch produces one or two lines. Story 1.11's deferral of compaction holds, with a crossover now written down: ~1 000 000 lines is ~5 s per reconciliation, and reconciliation runs at every boot. NOT measured, and stated as such: contention (many writers on one head under FOR UPDATE on real PostgreSQL) — that is AD-44's actual subject and belongs with the 2.13 run. measurements.json untouched (NFR-2)"
