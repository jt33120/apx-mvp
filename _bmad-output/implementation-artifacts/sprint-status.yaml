# Action items from the B3/B4 audit (2026-08-15).
# Full context: implementation-artifacts/b3-b4-audit-2026-08-15.md
# Every finding below was re-verified by hand after the agents reported it.
  - epic: 5
    action: "C1 BLOCKING SECURITY — POST /api/ingest takes `folder` as a bare str off the request body and validates it with one line, `if not folder.is_dir()`. No root, no containment, no allowlist (apx/api/app.py:1347, IngestRequest at :383). Any authenticated user holding any scope can name any directory the API process can read and have it walked, extracted, PERSISTED INTO THEIR OWN MATTER under their own RBAC scope, with originals retained — reading across every matter wall and every tenant on the host, under a product whose stated non-negotiables are Chinese walls and tenant isolation. Registered as a live production action (ingest-folder-route). The SPA uses /api/ingest-upload, but the API is the boundary. Story 2.1's review FOUND AND FIXED a traversal on the upload path and never asked the same question of the sibling route. FR-1's three traversal clauses (confinement to the subtree, a traversal-outside-root register class, cycle detection) are all unbuilt. Confine to a configured root, refuse outside it, build the three clauses, add a structural check"
    owner: "Dev"
    status: done
    resolution: "story 7-1, epic 7 (2026-08-15). The route is confined to APX_INGEST_ROOT (fail-closed when unset, refused when it can reach originals/ or spool/), out-of-root and absent answer identically so it is not a directory oracle, FR-1's three traversal clauses are built, and traversal-out-of-scope has its first producer. filesystem-has-one-walk (103 -> 104) holds the one-walk property. Gate green at 2 113 tests"
  - epic: 5
    action: "C2 BLOCKING — nine tenant-scoped tables are absent from _BACKUP_TABLES, derived from the live model metadata (35 mapped, 29 tenant-scoped, 20 in the backup): artefact_stamp, case_theory_version, import_job, piece_open, ranked_entry, ranking_version, register_override, sampling_run, validation_act. A restore loses every ranking and ranked order, every case theory, every sampling run and therefore every confidence bound, every validation act, every recorded piece-open, every override and every freshness stamp — while the audit record SURVIVES, so the restored record attests a validation whose ledger is gone. The list is hand-maintained: 5.5 added audit_chain_head, 5.9 added journal_gap, B2 independently found register_override missing, and nobody ever asked whether the list was complete. Make it complete BY CONSTRUCTION: a structural check asserting every tenant-scoped mapped table is in the backup or on a written exclusion list with a reason — the test_never_hard_delete discipline applied to DR"
    owner: "Dev"
    status: done
    resolution: "story 7-2, epic 7 (2026-08-18). The list is GONE. apx/adapters/store_postgres/backup_plan.py derives what a backup captures from Base.metadata by four rules — a tenant column, a declared foreign key to an already-captured table, a written predicate, a written exclusion — and RAISES IncompleteBackupPlan naming every table that matches none, so a model nobody thought about stops the backup instead of being dropped from it. 20 of 35 -> 35 of 35: the nine C2 named plus THREE the audit's own question could not see (import_unit, sampling_run_item, sampling_verdict are keyed by a parent, not by tenant, so a sweep counting tenant columns never reached them — restoring sampling_run without them restores a draw with no drawn families and no verdicts, i.e. the run's numbers and nothing that could produce them again). Rules 1-2 run to a fixpoint over metadata.sorted_tables, which is topological, so the RESTORE'S INSERT ORDER comes from the model rather than from the order somebody typed the tuple in; the one hand-written predicate (user_scope, no declared FK) is appended after that fixpoint. TenantBackup lost user_scopes and piece_links: two representations of one fact is how a table could be in the model, absent from the tuple AND absent from the dataclass with nothing saying so. 105 -> 106 checks (backup-plan-is-total, whose fourth leg was removed during review as UNREACHABLE — backup_plan raises rather than returning a subset, and a leg that cannot fire is not a guard). Proven: 3 of 5 new plan tests and 3 of 5 new restore tests fail against HEAD:store.py; test_the_denominator_is_identical and the audit-sequence test pass BOTH ways (those tables were in the old tuple) and are recorded as regression guards, not proofs. The round-trip test first passed on the broken code because both sides of the comparison shrank with the defect — the denominator is now pinned to the plan"
  - epic: 5
    action: "C3 — AD-32's Rule opens 'a complete restorable backup of a tenant — ORIGINALS, extracted text, index, audit record, failure register, configuration'. backup_tenant (store.py:3187) runs SELECT * FROM {tbl} over _BACKUP_TABLES and nothing else; the string 'original' does not appear in the function; the originals live on the filesystem under FilesystemOriginalStore. The backup is also written as PLAINTEXT JSON (apx/manage.py:123). Put the originals in the backup, or amend AD-32 to say they are out of it"
    owner: "Dev + Julian"
    status: done
    resolution: "story 7-2, epic 7 (2026-08-18). Both halves of the Rule, built rather than amended away. (a) The ORIGINALS travel: the OriginalStore port grew a backup face — sealed_blobs / read_sealed / put_sealed — that never decrypts, so taking a backup needs no encryption key and never holds a firm's corpus in the clear, and the AAD binding (tenant, content_hash, kind) means a blob restored under another identity fails authentication rather than being served as that document. sealed_blobs enumerates the STORE, not a column: no table names the ocr-layout a pièce may carry, so a list-driven backup would have left it behind while reporting it had backed up the originals. (b) The bundle is SEALED — chunk.full_text is plaintext in the database on purpose (you cannot index ciphertext) and volume encryption is what protects it, and a backup file is the one artefact designed to leave that volume; the payload is AES-256-GCM under the application key and the (hash, kind) inventory is sealed WITH it, so a restore puts back what the key attests rather than whatever is in the folder (a blob planted in the directory afterwards is not restored). A retained pièce whose document is not on the volume makes the recorded outcome a FAILURE with the count named — the bundle is still written, because a firm holding an incomplete backup is better off than one holding none. filesystem-has-one-walk fired twice on the diff and both were answered by STRENGTHENING, never by the permitted list: restore_originals' iterdir was removed by sealing the inventory, and sealed_blobs' rglob now goes through walk_confined, so a symlink planted in the blob directory refuses the enumeration instead of copying another firm's blobs into this tenant's backup"
  - epic: 5
    action: "C4 BLOCKING PLANNING — the ranking act has no production caller. grep over apx/ returns definitions only; apx/api/app.py has ZERO references to produce_ranking, record_ranking or run_cascade; 8 test files call it. No HTTP route, no worker job, no manage command creates a ranking version — the only judgement a user can invoke is POST /api/matters/{matter}/judge, which runs triage_pieces (the Story-2.x label pile), not the Epic-4 cascade. This IS recorded (stories 4.6 and 4.13 both state the deferral in writing) which makes it worse rather than better: the ranked table, the line, pins, the priced move, derived confidence, justifications, the sampling run, the estimator, the bound, the validation act and sections 5-9 of the matter record — 22 shipped stories — all stand on an act no user gesture can perform, and epics.md schedules the wiring in NO story. Epic 6 is the last epic in the plan and does not contain it"
    owner: "Julian + Dev"
    status: in-progress
    resolution: "PART 1 DONE — story 7-3 (2026-08-18). The act has its first production caller: manage rank + manage place-line, sourcing every input from the deployment. The reconnaissance widened the finding: SEVEN Epic-4 acts have no HTTP surface, not one, so Epic 5 is unreachable for the same reason; and AD-6 names ranking as a queued job, which does not exist. The lawyer's gesture — the queued job, the HTTP surface, the client states, the line and pin controls — is C11 / story 7.4. What is closed here is the part every version of the gesture needed and would otherwise have got wrong: the identity now names the judge that actually ran"
  - epic: 5
    action: "C5 — build the worklist half. Of 141 clauses the B4 sweep records as not built, a large coherent share are one sentence repeated across FR-1, 2, 3, 5, 6, 7, 9 and 10: 'and it surfaces on the worklist as an actionable line' / 'and generates a worklist line' / 'where an entry is required to be actionable, the action must exist'. The mechanism was built every time; the half that TELLS the lawyer and gives her the control was not. core/domain/worklist.py emits freshness lines and FR-23's unfitness line and nothing else. One story, not 141 defects — and the largest single risk to FR-59's usability gate, which would otherwise review surfaces that do not exist"
    owner: "Julian + Dev"
    status: open
  - epic: 5
    action: "C6 — restore AD-4's two tightening contracts in pyproject.toml:137-146. Both are commented out and labelled '# tightened in 1.12'; story 1.12 is DONE. An AST walk of apx/adapters finds 13 cross-package import edges across 8 distinct package pairs (store_postgres -> embedder_bgem3/expansion/extraction/ocr_tesseract/originals_fs; render_html -> extraction/spool; render_image -> spool). The commented contract would not restore the property: an `independence` contract constrains only edges BETWEEN listed modules and it names five, so it reaches 3 of the 8 pairs. Size it to the tree as it now is"
    owner: "Dev"
    status: open
  - epic: 5
    action: "C7 — settle AD-22 against AD-6 for bulk acts, in the spine, in writing. SqlStore.bulk_retry (store.py:2010-2034) opens a transaction INSIDE the candidate loop and writes the single bulk-retry audit entry in an (N+1)th transaction after it, so N business acts commit and a crash before the last one leaves them recorded nowhere. AD-22 says an act whose entry cannot be written FAILS, both or neither; AD-6/FR-5 require exactly one entry per bulk job, never one per piece. The two cannot both hold for this shape and the code chooses AD-6 silently. This needs a decision, not a fix"
