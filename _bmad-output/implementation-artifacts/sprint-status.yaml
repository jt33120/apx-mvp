  7-1-ingestion-is-confined-to-a-configured-root: done  # C1/FR-1. POST /api/ingest took `folder` as a bare str from the request body and validated it with ONE line, `if not folder.is_dir()` — no root, no containment, no allowlist. Any authenticated user holding any scope could name any directory the API process could read and have it walked, extracted and PERSISTED INTO THEIR OWN MATTER under their own RBAC scope, originals retained: $APX_DATA_PATH/originals (every matter's retained documents) and spool/<job> (another user's upload in flight) are the predictable targets. Story 2.1's review had found and fixed a traversal on the sibling UPLOAD path and never asked the same question here, and `ErrorClass.TRAVERSAL_OUT_OF_SCOPE` had sat in the taxonomy since with NO PRODUCER. Now: one door (core/domain/traversal.py) owning both the outer root (APX_INGEST_ROOT, fail-closed when unset, refused when it can reach originals/ or spool/ in either direction) and the inner subtree (walk_confined); out-of-root and absent answer IDENTICALLY so the route is not a directory oracle; a symlink out of the subtree — file OR directory — is recorded as traversal-out-of-scope and never read; a cycle terminates (pinned by test, since the property is Python 3.13's recurse_symlinks=False default and not ours); the capacity pre-flight counts from the SAME walk that ingests. 103 -> 104 checks (filesystem-has-one-walk). The check's own first defect was the family it exists to close — matching the bare attribute `walk` flagged projection.py's local recursive walk(value) over a mapping, a guard inspecting the SHAPE not the property; os.* is now matched only in qualified form and the false positive is a named regression. 148 suite failures on the way were the rule working: pinning APX_DATA_PATH inside the ingest root IS the unsafe configuration, and the suite now puts the data volume beside the ingestable tree as a deployment does. 2 083 -> 2 113 tests (Julian, 2026-08-15)
  7-2-the-backup-is-complete-by-construction: done  # C2 + C3. What a tenant backup captures is DERIVED from Base.metadata (a tenant column, a declared FK to a captured table, a written predicate, a written exclusion) and an unclassified table RAISES — 20 of 35 tables -> 35 of 35, including three keyed by a parent that the audit's own tenant-column question could not see (import_unit, sampling_run_item, sampling_verdict). Rules 1-2 reach a fixpoint over sorted_tables, so the restore's insert order is the model's. The retained ORIGINALS now travel, copied as the ciphertext they already are (no key needed to take a backup, no corpus in the clear), enumerated off the store so a derived ocr-layout kind travels too; the bundle is a sealed directory with the blob inventory INSIDE the seal, because chunk.full_text is deliberately plaintext under volume encryption and a backup file is the one artefact that leaves the volume. The recorded outcome states its coverage and a retained pièce with no document makes it a FAILURE. 105 -> 106 checks (backup-plan-is-total). AD-32's four unbuilt clauses filed as C10. 2 141 -> 2 173 tests (Julian, 2026-08-18)
  7-3-the-ranking-act-gets-a-caller: done  # C4 (part 1 of 2). A nine-agent reconnaissance found the hole is LARGER than C4 as filed: SEVEN Epic-4 acts have no HTTP surface — produce_ranking, place_line, price_line_move, move_line, pin_piece, remove_pin, record_justification — so Epic 5's routes answer 404 "pas de classement, pas de ligne" and their precondition can never be created; and a ranking route shipped ALONE would make the product worse (a re-rank supersedes the committed line, the worklist emits no offer for a superseded artefact, and no route can place a line again). AD-6 names ranking by name as a QUEUED job, and there is no ranking job ledger. So: this story is the act's first honest caller (manage rank + manage place-line), and 7.4 is the gesture. The part that was not obvious: the identity was going to LIE. temperature and sampling had no source at all (a literal 0 inside the adapter's private request body; the live request sends NO sampling parameter, so the sampling={"top_p": 1.0} in every fixture was invention), and the model keys are config-as-data — a preference — while this deployment composes the bare CriteriaJudge whenever no credential is present. A config-sourced identity would have stamped mistral-small-latest onto an order decided by a comma-splitting keyword matcher, in an immutable fingerprint. Each judge now reports its own JudgeIdentity, the judge has ONE composition site (apx/wiring.py, moved out of the API), and RankingIdentityInputs has ONE composer. cascade_units is the WHOLE population, never representatives (which pre-collapses near-duplicates and would have made 900 of 1000 pièces read as "arrivées après ce classement" and turned SM-18's cost figure from 0.1 into 1.0). The wall gate comes FIRST because read_case_theory returns None for out-of-scope and for absent alike and a None theory is also how the act says "rank on intrinsic signals". 106 -> 107 checks (ranking-identity-one-source, whose first draft was a shape check flagging nine legitimate sites and was narrowed to a CALL passing the key). New items C11, C12, C13. 2 173 -> 2 191 tests (Julian, 2026-08-18)
  7-4-the-epic-4-write-surface-and-the-worklist: backlog  # C11 + C5 + C9
  7-5-the-contracts-that-were-commented-out: backlog  # C6 + C7
  7-6-upgrade-fails-closed-and-the-monotonic-counter: backlog  # B5 — AD-46, AD-49, AD-44
