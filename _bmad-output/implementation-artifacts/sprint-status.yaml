  5-5-the-audit-record: done  # the record LOOKED nearly finished (one chain per tenant, 35 call sites, 25 verbs) and could not do the one thing FR-53 turns on: a per-MATTER export (FR-26) had a hole wherever a sibling matter had written, and its links ran through entries the bâtonnier is not entitled to see — the artefact reported tampering on an untampered record, every time. AD-43 implemented at last, both halves: chains per (tenant, matter) plus one matterless tenant chain, and the sequence allocated INSIDE the acting transaction from a head row under SELECT ... FOR UPDATE, never a generator (a burned nextval manufactures a permanent tamper alarm AD-22 forbids repairing). Versioned chained content, so pre-5.5 entries keep verifying under the recipe they were written with; NOTHING re-chained, renumbered or moved — the head journal holds those values outside the restorable store and a migration that rewrote them would have forged the record with our own hands. 40 verbs catalogued with FR-24 class + chain; actor="unknown" removed everywhere. 3 checks (89 -> 92). Review: 6/6 lenses, 23 findings, 45 verdicts, 9 confirmed, 0 unadjudicated, 25 agents lost to a network outage and RECOVERED rather than counted as refutations — incl. a restore that left the tenant PERMANENTLY unable to write (audit_chain_head was outside the backup: it touched every backup the deployment holds today) and FOR UPDATE failing to lock a row that does not exist. One HIGH found after the review by execution: a chain gone quiet since an override could be erased wholesale, invisibly — the override now writes down what it accepted. One hardening DECLINED: two skeptics reproduced the forgery with the anchor intact, so the proposed anchor cross-check would have closed nothing while looking like a defence; the story's D4 CLAIM was corrected instead (Julian, 2026-08-13)
  5-6-overrides-with-a-mandatory-one-line-reason: done  # FR-25. The override became a PROPERTY of an act carrying one of FR-25's three grounds, not a class: a pin is an override whose FR-24 class is `pin`, so counting by class reported zero on a matter with forty pins. One validator for "mandatory" (two existed, a third was about to be written); the reason verbatim in the record through one renderer, and clear_truncation had never put its reason there at all. AD-37's `open → overridden` register transition built: one owning use case, conditional commit under a row lock, atomic with its entry, reason on an append-only ledger, non-disclosing on an absent id. 92 → 95 structural checks. Review (inline, the agent fleet being disabled this session): 8 confirmed, 2 HIGH — an override broke SM-3's denominator identity, which now has a THIRD term (`overridden_register_entries`), and `_settle_submitted_after_retry` would have erased every written-off entry from the denominator on the next retry. Declined: a minimum reason length (twelve identical characters satisfy any floor). Reversal of an override is 5.7's.
